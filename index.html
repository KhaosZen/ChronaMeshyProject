<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1c1a; color: #cfc8b8;
    font-family: "Songti SC", "Noto Serif SC", Georgia, serif; user-select: none; }

<body>
<div id="start" class="layer">

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DEBUG = new URLSearchParams(location.search).has('debug');

/* =====================================================================
 * 1. 配置
 * ===================================================================*/
const CFG = {
  eyeHeight: 1.6, radius: 0.3, walkSpeed: 2.0, runSpeed: 3.2,
  gravity: 20, stepHeight: 0.45, lookSens: 0.0022, reach: 2.2,
};

// 哑光低饱和色板
const C = {
  fog: '#1d1c1a', wall: '#8c877a', trim: '#5e574c', floor: '#5a4e44', ceiling: '#a19c90',
  wood: '#6a5646', wood2: '#57473b', metal: '#6d6a62', stair: '#6b6157',
  bark: '#4b4037', moss: '#5d6a4a', leaf: '#58664a', paper: '#cbc2ab', brass: '#8d7d57',
  terracotta: '#8a5f4b', cloth: '#766b62', crack: '#2b2622', ink: '#3a2e29', bulb: '#f2dcb0',
};

// 窗外光：1-2 楼傍晚，3 楼起正午
const SKY = {
  dusk: { sky: '#a07a5c', light: '#d9a276', intensity: 5 },
  noon: { sky: '#bdbbae', light: '#e8e4d4', intensity: 7 },
};

// 墙上字迹（TODO: 待定文案。三行合起来像一句话但差一个词）
const TEXT_LINES = ['（词）（词）', '（词）（词）', '（词）（词）'];

// 影响结局的特定道具（暂定钥匙，体验后再调）
const ENDING_ITEM = 'key';

/* 资产清单：file = assets/ 下的 GLB 文件名；null = 用程序化占位几何体。
 * size = 目标包围盒 [x, y, z]（米）。GLB 载入后会拉伸到该尺寸，并把底面中心对齐到原点。
 * rot  = 可选，载入后先旋转 [x, y, z]（弧度），用于修正 Meshy 模型朝向。
 * 约定：模块宽度沿 X，正面朝 +Z，底面在 y=0。 */
const ASSET_BASE = './assets/';
const ASSETS = {
  // 建筑
  wall:       { file: null, size: [2, 3, 0.2] },
  wallDoor:   { file: null, size: [2, 3, 0.2] },   // 门框（关）
  wallDoorOpen: { file: null, size: [2, 3, 0.2] }, // 门框（开）
  wallWindow: { file: null, size: [2, 3, 0.2] },   // 窗框
  floor:      { file: null, size: [2, 0.1, 2] },
  ceiling:    { file: null, size: [2, 0.1, 2] },
  stairs:     { file: null, size: [3.2, 3, 6] },   // 向 -Z 上升的一整跑楼梯
  railing:    { file: null, size: [2, 1, 0.1] },
  // 树
  trunk:      { file: null, size: [1, 7, 1] },
  rootMass:   { file: null, size: [1.2, 1.6, 0.6] },
  moss:       { file: null, size: [1.2, 0.03, 1.2] },
  leaves:     { file: null, size: [0.8, 0.6, 0.8] },   // 树冠块
  // 道具
  chair:      { file: 'chair_old.glb', size: [0.5, 0.95, 0.5] },
  cup:        { file: null, size: [0.12, 0.1, 0.1], rot: [Math.PI, 0, 0] },  // 倒扣
  frame:      { file: null, size: [0.36, 0.46, 0.03] },
  letter:     { file: null, size: [0.2, 0.04, 0.14] },
  key:        { file: null, size: [0.12, 0.02, 0.04] },
  pot:        { file: null, size: [0.26, 0.24, 0.26] },
  // 氛围
  lamp:       { file: null, size: [0.5, 1, 0.5] },   // 发光材质（emissive）作为灯泡
  curtain:    { file: null, size: [0.7, 1.4, 0.02] },
  crack:      { file: null, size: [1.2, 0.01, 0.4] },
};
const MATTE_OVERRIDE = true; // 强制 GLB 材质哑光，去掉法线/粗糙度/金属度贴图

/* =====================================================================
 * 2. 平台适配层 —— 所有与 Chrona 相关的调用集中在这里
 *    TODO(Day1 晚): 确认 Chrona 交互 API 后在此接入（拾取 / 触发 / 对话）
 * ===================================================================*/
const Platform = {
  name: 'standalone',
  emit(evt, detail = {}) {
    if (DEBUG) console.log('[platform]', evt, detail);
    window.dispatchEvent(new CustomEvent('root:' + evt, { detail }));
  },
};

/* =====================================================================
 * 3. 渲染基础
 * ===================================================================*/
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.fog);
scene.fog = new THREE.Fog(C.fog, 3, 24);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 80);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight('#8f8a80', '#2a2622', 0.35);
scene.add(hemi);

/* =====================================================================
 * 4. 程序化占位几何体（Meshy GLB 到位前使用）
 * ===================================================================*/
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial(
    { color, roughness: 1, metalness: 0, flatShading: true, ...opts }));
  return matCache.get(key);
}
function box(w, h, d, color, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); return m;
}
function group(...children) { const g = new THREE.Group(); children.forEach(c => g.add(c)); return g; }

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// 锥形管（树根/树枝），低多边形
function taperedTube(points, r0, r1 = r0 * 0.15, seg = 12, radial = 5, color = C.bark) {
  const curve = new THREE.CatmullRomCurve3(points);
  const frames = curve.computeFrenetFrames(seg, false);
  const pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, p = curve.getPointAt(t), r = r0 + (r1 - r0) * t;
    const N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(p.x + r * (c * N.x + s * B.x), p.y + r * (c * N.y + s * B.y), p.z + r * (c * N.z + s * B.z));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial, c = a + radial, d = b + radial;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, mat(color));
}

// 墙段＋门框；open=true 时门板向内打开
function doorWall([w, h, d], open) {
  const ow = 1.0, oh = 2.2, pw = (w - ow) / 2;
  const leaf = new THREE.Group(); leaf.position.set(-ow / 2 + 0.01, 0, -0.02); // 铰链在左侧
  leaf.add(box(ow - 0.02, oh - 0.02, 0.05, C.wood2, (ow - 0.02) / 2, (oh - 0.02) / 2, 0),
    box(0.03, 0.12, 0.04, C.metal, ow - 0.13, 1.0, 0.05));
  if (open) leaf.rotation.y = 1.35;
  return group(
      box(pw, h, d, C.wall, -(ow + pw) / 2, h / 2), box(pw, h, d, C.wall, (ow + pw) / 2, h / 2),
      box(ow, h - oh, d, C.wall, 0, oh + (h - oh) / 2),
      box(0.08, oh + 0.05, d + 0.04, C.wood, -ow / 2 - 0.04, (oh + 0.05) / 2),
      box(0.08, oh + 0.05, d + 0.04, C.wood, ow / 2 + 0.04, (oh + 0.05) / 2),
      box(ow + 0.16, 0.08, d + 0.04, C.wood, 0, oh + 0.04),
      box(pw, 0.12, 0.03, C.trim, -(ow + pw) / 2, 0.06, d / 2 + 0.015),
      box(pw, 0.12, 0.03, C.trim, (ow + pw) / 2, 0.06, d / 2 + 0.015),
      leaf);
}

const PLACEHOLDER = {
  wall: ([w, h, d]) => group(box(w, h, d, C.wall, 0, h / 2), box(w, 0.12, 0.03, C.trim, 0, 0.06, d / 2 + 0.015)),
  wallDoor: size => doorWall(size, false),
  wallDoorOpen: size => doorWall(size, true),
  leaves: ([w, h]) => { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(w / 2, 0), mat(C.leaf)); m.scale.y = h / w; m.position.y = h / 2; return m; },
  wallWindow: ([w, h, d]) => {
    const y0 = 0.9, y1 = 2.2, ow = 1.2, pw = (w - ow) / 2;
    return group(
      box(w, y0, d, C.wall, 0, y0 / 2), box(w, h - y1, d, C.wall, 0, y1 + (h - y1) / 2),
      box(pw, y1 - y0, d, C.wall, -(ow + pw) / 2, (y0 + y1) / 2), box(pw, y1 - y0, d, C.wall, (ow + pw) / 2, (y0 + y1) / 2),
      box(ow + 0.1, 0.05, d + 0.1, C.trim, 0, y0 + 0.025, 0.03),
      box(0.05, y1 - y0, 0.06, C.wood, -ow / 2 + 0.025, (y0 + y1) / 2), box(0.05, y1 - y0, 0.06, C.wood, ow / 2 - 0.025, (y0 + y1) / 2),
      box(0.04, y1 - y0, 0.04, C.wood, 0, (y0 + y1) / 2), box(ow, 0.04, 0.04, C.wood, 0, y0 + (y1 - y0) * 0.65),
      box(w, 0.12, 0.03, C.trim, 0, 0.06, d / 2 + 0.015));
  },
  floor: ([w, h, d]) => box(w, h, d, C.floor, 0, h / 2),
  ceiling: ([w, h, d]) => box(w, h, d, C.ceiling, 0, h / 2),
  stairs: ([w, h, d]) => {
    const n = 15, rise = h / n, run = d / n, g = new THREE.Group();
    for (let i = 0; i < n; i++) g.add(box(w, (i + 1) * rise, run, C.stair, 0, (i + 1) * rise / 2, d / 2 - (i + 0.5) * run));
    return g;
  },
  railing: ([w, h]) => {
    const g = group(box(w, 0.05, 0.06, C.wood, 0, h));
    for (let x = -w / 2 + 0.1; x <= w / 2; x += 0.25) g.add(box(0.03, h, 0.03, C.metal, x, h / 2));
    return g;
  },
  trunk: ([w, h]) => {
    const pts = [[0, -0.5, 0], [0.08, h * 0.3, 0.05], [-0.05, h * 0.6, -0.04], [0.06, h, 0]].map(p => new THREE.Vector3(...p));
    return taperedTube(pts, w / 2, w * 0.35, 10, 7);
  },
  rootMass: ([w, h]) => {
    const rng = mulberry32(7), g = new THREE.Group();
    for (let i = 0; i < 6; i++) {
      const x0 = (rng() - 0.5) * w, x1 = (rng() - 0.5) * w;
      g.add(taperedTube([new THREE.Vector3(x0, -0.1, 0.1), new THREE.Vector3((x0 + x1) / 2 + (rng() - .5) * .4, h * (0.4 + rng() * 0.4), 0.15 + rng() * 0.2),
        new THREE.Vector3(x1, h, 0)], 0.08 + rng() * 0.05, 0.02, 10, 5));
    }
    return g;
  },
  moss: ([w]) => {
    const geo = new THREE.CircleGeometry(w / 2, 7); const p = geo.attributes.position;
    for (let i = 1; i < p.count; i++) { const s = 0.6 + Math.sin(i * 12.9898) * 0.4; p.setXY(i, p.getX(i) * s, p.getY(i) * s); }
    const m = new THREE.Mesh(geo, mat(C.moss, { polygonOffset: true, polygonOffsetFactor: -1 }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.005; return m;
  },
  chair: () => {
    const g = group(box(0.46, 0.04, 0.44, C.wood, 0, 0.46));
    for (const [x, z] of [[-0.2, -0.19], [0.2, -0.19], [-0.2, 0.19], [0.2, 0.19]]) g.add(box(0.04, 0.46, 0.04, C.wood2, x, 0.23, z));
    g.add(box(0.04, 0.5, 0.04, C.wood2, -0.2, 0.72, -0.19), box(0.04, 0.5, 0.04, C.wood2, 0.2, 0.72, -0.19),
      box(0.44, 0.08, 0.03, C.wood, 0, 0.9, -0.19), box(0.44, 0.06, 0.03, C.wood, 0, 0.72, -0.19));
    return g;
  },
  cup: () => { // 倒扣：宽口朝下
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.1, 7), mat(C.paper)); body.position.y = 0.05;
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.008, 4, 6, Math.PI), mat(C.paper));
    handle.position.set(0.045, 0.05, 0); handle.rotation.z = -Math.PI / 2;
    return group(body, handle);
  },
  frame: ([w, h, d]) => group(box(w, 0.04, d, C.wood, 0, 0.02), box(w, 0.04, d, C.wood, 0, h - 0.02),
    box(0.04, h, d, C.wood, -w / 2 + 0.02, h / 2), box(0.04, h, d, C.wood, w / 2 - 0.02, h / 2),
    box(w - 0.06, h - 0.06, 0.005, C.cloth, 0, h / 2, -d / 2)),
  letter: () => {
    const a = box(0.2, 0.004, 0.07, C.paper, 0, 0.02, 0.03), b = box(0.2, 0.004, 0.07, C.paper, 0, 0.02, -0.03);
    a.rotation.x = 0.35; b.rotation.x = -0.35; return group(a, b);
  },
  key: () => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.005, 4, 8), mat(C.brass));
    ring.rotation.x = Math.PI / 2; ring.position.set(-0.04, 0.006, 0);
    return group(ring, box(0.07, 0.008, 0.008, C.brass, 0.02, 0.006), box(0.01, 0.008, 0.016, C.brass, 0.045, 0.006, 0.01));
  },
  pot: () => {
    const pts = [[0, 0], [0.09, 0], [0.11, 0.18], [0.13, 0.2], [0.13, 0.24], [0.11, 0.24], [0.1, 0.05]].map(([x, y]) => new THREE.Vector2(x, y));
    return new THREE.Mesh(new THREE.LatheGeometry(pts, 7), mat(C.terracotta, { side: THREE.DoubleSide }));
  },
  lamp: ([, h]) => {
    const shade = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.18, 6, 1, true), mat(C.metal, { side: THREE.DoubleSide }));
    shade.position.y = 0.25;
    const bulb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), mat(C.bulb, { emissive: C.bulb, emissiveIntensity: 1 }));
    bulb.position.y = 0.17;
    return group(box(0.01, h - 0.34, 0.01, C.metal, 0, 0.34 + (h - 0.34) / 2), shade, bulb);
  },
  curtain: ([w, h]) => {
    const geo = new THREE.PlaneGeometry(w, h, 6, 4); const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      p.setZ(i, Math.sin(x * 14) * 0.03);
      if (y < -h / 4) p.setY(i, y + Math.abs(Math.sin(x * 23 + i)) * h * 0.25); // 破损下摆
    }
    geo.computeVertexNormals(); geo.translate(0, h / 2, 0);
    return new THREE.Mesh(geo, mat(C.cloth, { side: THREE.DoubleSide }));
  },
  crack: ([w, , d]) => {
    const shape = new THREE.Shape(); const rng = mulberry32(3);
    shape.moveTo(-w / 2, 0);
    for (let i = 1; i <= 8; i++) shape.lineTo(-w / 2 + w * i / 8, (rng() - 0.5) * d * 0.5 + d * 0.08);
    for (let i = 8; i >= 0; i--) shape.lineTo(-w / 2 + w * i / 8, (rng() - 0.5) * d * 0.5 - d * 0.08);
    const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat(C.crack, { polygonOffset: true, polygonOffsetFactor: -2 }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.004; return m;
  },
};

/* =====================================================================
 * 5. 资产加载（GLB 外链，失败回落到占位体）
 * ===================================================================*/
const templates = {};
function normalizeGLB(root, { size, rot }) {
  if (rot) { root.rotation.set(...rot); root.updateMatrixWorld(true); }
  const bb = new THREE.Box3().setFromObject(root), s = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -bb.min.y, -c.z);
  const wrap = group(root);
  wrap.scale.set(size[0] / (s.x || 1), size[1] / (s.y || 1), size[2] / (s.z || 1));
  if (MATTE_OVERRIDE) root.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      if (!m.isMeshStandardMaterial) continue;
      m.roughness = 1; m.metalness = 0; m.normalMap = m.roughnessMap = m.metalnessMap = null; m.flatShading = true; m.needsUpdate = true;
    }
  });
  return wrap;
}
async function loadAssets() {
  const loader = new GLTFLoader();
  await Promise.all(Object.entries(ASSETS).map(async ([name, a]) => {
    if (a.file) {
      try { templates[name] = normalizeGLB((await loader.loadAsync(ASSET_BASE + a.file)).scene, a); }
      catch (e) { console.warn(`GLB 载入失败，改用占位体: ${a.file}`, e); }
    }
    if (!templates[name]) templates[name] = PLACEHOLDER[name](a.size);
  }));
}
function part(name, x = 0, y = 0, z = 0, rotY = 0, parent = scene) {
  const o = templates[name].clone(true);
  o.position.set(x, y, z); o.rotation.y = rotY; parent.add(o); return o;
}

/* =====================================================================
 * 6. 物理代理（不可见的行走面 + AABB 墙体碰撞），与视觉模型解耦
 * ===================================================================*/
const walkables = [], colliders = [];
const proxyMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
function walkQuad(a, b, c, d) { // 四个角点 [x,y,z]
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([...a, ...b, ...c, ...a, ...c, ...d], 3));
  const m = new THREE.Mesh(g, proxyMat); m.visible = false; scene.add(m); walkables.push(m); return m;
}
function collider(minX, maxX, minZ, maxZ, minY = -1, maxY = 20) {
  const c = { minX, maxX, minZ, maxZ, minY, maxY, enabled: true }; colliders.push(c); return c;
}

/* =====================================================================
 * 7. 关卡：走廊 + 楼梯间。每一层都复用这段空间，按楼层切换状态（8号出口式）
 *    坐标：玩家沿 -Z 前进；走廊 x∈[-1.6,1.6]，z∈[0,-28]；楼梯间 z∈[-28,-38]；楼梯顶的门通往下一层
 * ===================================================================*/
const W = 3.2, HW = W / 2, H = 3, M = 2;
const Z_STAIR = -28, Z_END = -38, STAIR_H = 6.4;
const LEFT = Math.PI / 2, RIGHT = -Math.PI / 2;

const world = {
  lamps: [], windowLights: [], sky: null, sun: null, texts: [], props: {}, sprouts: {},
  roots: [], blockedDoorRoots: null, swapDoor: null, swapWall: null, chair: null, trunk: null,
  curtain: null, extraRoot: null, railRoots: null, windowBranches: null, sunPatch: null, placedPot: null,
  landingDoor: null, landingDoorOpen: null, doorCollider: null, floorSign: null,
};
const interactables = []; // 非拾取类交互：{ obj.userData.interact = { label(), act() } }
function makeInteractable(obj, label, act) { obj.userData.interact = { label, act }; interactables.push(obj); }

function buildLevel() {
  const rng = mulberry32(2026);

  // --- 地板 / 天花板
  for (let z = -M / 2; z > Z_END; z -= M) for (const x of [-0.8, 0.8]) {
    const f = part('floor', x, -0.1, z); f.scale.x = 0.8;
    const cy = z > Z_STAIR ? H : STAIR_H;
    const c = part('ceiling', x, cy, z); c.scale.x = 0.8;
  }
  walkQuad([-HW, 0, 0], [HW, 0, 0], [HW, 0, Z_END], [-HW, 0, Z_END]);

  // --- 走廊墙：左侧门、右侧窗
  const leftDoors = [2, 6, 10], rightWindows = [1, 4, 7, 12];
  for (let i = 0; i < 14; i++) {
    const z = -(i * M + M / 2);
    if (i === 10) { // 4 楼的布局微变：这扇门变成墙
      world.swapDoor = part('wallDoor', -HW - 0.1, 0, z, LEFT);
      world.swapWall = part('wall', -HW - 0.1, 0, z, LEFT); world.swapWall.visible = false;
    } else part(leftDoors.includes(i) ? 'wallDoor' : 'wall', -HW - 0.1, 0, z, LEFT);
    part(rightWindows.includes(i) ? 'wallWindow' : 'wall', HW + 0.1, 0, z, RIGHT);
    if (rightWindows.includes(i)) {
      const l = new THREE.PointLight(SKY.dusk.light, 2, 5, 1.5); l.position.set(HW - 0.4, 1.6, z); scene.add(l);
      world.windowLights.push(l);
    }
  }
  // 残破窗帘
  world.curtain = part('curtain', HW - 0.02, 0.8, -(4 * M + M / 2) + 0.45, RIGHT);

  // --- 楼梯间墙（两层高）
  for (let i = 14; i < 19; i++) {
    const z = -(i * M + M / 2);
    for (const y of [0, H]) { part('wall', -HW - 0.1, y, z, LEFT); part('wall', HW + 0.1, y, z, RIGHT); }
  }
  // 起点墙、走廊天花板上方的隔墙、尽头墙（上层带门）
  for (const x of [-0.8, 0.8]) {
    part('wall', x, 0, 0.1, Math.PI).scale.x = 0.8;
    part('wall', x, H, Z_STAIR + 0.1, Math.PI).scale.x = 0.8;
    part('wall', x, 0, Z_END - 0.1).scale.x = 0.8;
  }
  for (const x of [-1.3, 1.3]) part('wall', x, H, Z_END - 0.1).scale.x = 0.3;
  // 楼梯顶的门：解开本层谜题才能打开
  world.landingDoor = part('wallDoor', 0, H, Z_END - 0.1);
  world.landingDoorOpen = part('wallDoorOpen', 0, H, Z_END - 0.1); world.landingDoorOpen.visible = false;
  makeInteractable(world.landingDoor, doorLabel, tryOpenDoor);
  // 门后：一小段黑暗的过道
  walkQuad([-0.5, H, Z_END], [0.5, H, Z_END], [0.5, H, Z_END - 2], [-0.5, H, Z_END - 2]);

  collider(-HW - 0.2, -HW, Z_END - 0.2, 0.2); collider(HW, HW + 0.2, Z_END - 0.2, 0.2);
  collider(-HW, HW, 0, 0.2);
  collider(-HW, HW, Z_END - 0.2, Z_END, -1, H);                     // 尽头墙下层
  collider(-HW, -0.5, Z_END - 0.2, Z_END, H); collider(0.5, HW, Z_END - 0.2, Z_END, H); // 门两侧
  world.doorCollider = collider(-0.5, 0.5, Z_END - 0.2, Z_END, H);  // 门板（关着时）
  collider(-0.7, -0.5, Z_END - 2, Z_END, H); collider(0.5, 0.7, Z_END - 2, Z_END, H);  // 过道两侧

  // 楼层号牌（楼梯口左墙）
  world.floorSign = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22), new THREE.MeshStandardMaterial({ roughness: 1 }));
  world.floorSign.position.set(-HW + 0.01, 1.7, -28.6); world.floorSign.rotation.y = Math.PI / 2; scene.add(world.floorSign);

  // --- 楼梯 z∈[-29,-35] 升到 y=3，平台 z∈[-35,-38]
  part('stairs', 0, 0, -32);
  scene.add(box(W, H, 3, C.stair, 0, H / 2, -36.5));
  walkQuad([-HW, 0, -29], [HW, 0, -29], [HW, H, -35], [-HW, H, -35]);
  walkQuad([-HW, H, -35], [HW, H, -35], [HW, H, Z_END], [-HW, H, Z_END]);
  // 沿墙扶手（倾斜）
  const railLen = Math.hypot(6, H), rail = box(0.05, 0.05, railLen, C.wood, -HW + 0.15, H / 2 + 0.9, -32);
  rail.rotation.x = Math.atan2(H, 6); scene.add(rail);
  for (let k = 0; k <= 7; k++) { const t = k / 7; scene.add(box(0.03, 0.9, 0.03, C.metal, -HW + 0.15, t * H + 0.45, -29 - t * 6)); }
  // 2 楼起：根缠绕扶手
  world.railRoots = new THREE.Group(); scene.add(world.railRoots);
  {
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 0.02) {
      const a = t * Math.PI * 16, y = 0.9 + t * H, z = -29 - t * 6;
      pts.push(new THREE.Vector3(-HW + 0.15 + Math.sin(a) * 0.06, y + Math.cos(a) * 0.06, z));
    }
    world.railRoots.add(taperedTube([new THREE.Vector3(-HW + 0.3, -0.05, -28.6), new THREE.Vector3(-HW + 0.2, 0.5, -28.9), ...pts], 0.05, 0.015, 80, 4));
  }

  // --- 树：主干从平台角落穿出屋顶
  world.trunk = part('trunk', 1.0, 0, -37.2);
  collider(0.55, 1.45, -37.65, -36.75);

  // --- 树根（一楼：刚冒出来）
  const rootsGroup = (x, z, build) => { const g = new THREE.Group(); g.position.set(x, 0, z); build(g); scene.add(g); world.roots.push(g); return g; };
  const creeping = (g, angle, len, r0) => {
    const pts = []; let a = angle, x = 0, z = 0;
    for (let i = 0; i <= 6; i++) {
      pts.push(new THREE.Vector3(x, r0 * 0.4 + Math.sin(i * 1.7) * 0.03, z));
      a += (rng() - 0.5) * 0.7; x += Math.sin(a) * len / 6; z += Math.cos(a) * len / 6;
    }
    g.add(taperedTube(pts, r0, r0 * 0.12, 14, 5));
  };
  const arch = (g, angle, len, hgt, r0) => {
    const d = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
    const pts = [0, 0.3, 0.6, 1].map((t, i) => d.clone().multiplyScalar(len * t).setY([-0.08, hgt, hgt * 0.7, -0.08][i]));
    g.add(taperedTube(pts, r0, r0 * 0.5, 10, 5));
  };
  // 楼梯底下涌出的主根，爬向走廊
  rootsGroup(0.9, -29.2, g => { for (let k = 0; k < 4; k++) creeping(g, Math.PI * (0.85 + rng() * 0.3), 4 + rng() * 5, 0.09 + rng() * 0.05); });
  rootsGroup(-1.0, -29.2, g => { for (let k = 0; k < 3; k++) creeping(g, Math.PI * (0.9 + rng() * 0.2), 3 + rng() * 3, 0.07 + rng() * 0.04); });
  // 地板裂缝中拱起的细根
  for (const [x, z] of [[0.4, -8.5], [-0.7, -15], [0.9, -21], [-0.3, -25.5]]) {
    part('crack', x, 0, z, rng() * Math.PI);
    rootsGroup(x, z, g => arch(g, rng() * Math.PI * 2, 0.6 + rng() * 0.5, 0.15 + rng() * 0.12, 0.035));
  }
  for (const [x, z] of [[0.6, -27.5], [-0.9, -26.2], [1.2, -20.5]]) part('moss', x, 0, z, rng() * 6);
  // 重复同一层时的异常之一：走廊中间多出一条根
  world.extraRoot = rootsGroup(0.1, -11, g => arch(g, 0.4, 1.2, 0.3, 0.06)); world.extraRoot.visible = false;

  // 3 楼起：树枝穿窗
  world.windowBranches = new THREE.Group(); scene.add(world.windowBranches);
  for (const i of rightWindows) {
    const z = -(i * M + M / 2), dz = (rng() - 0.5) * 0.6;
    const tip = new THREE.Vector3(0.3 + rng() * 0.4, 1.7 + rng() * 0.3, z + dz + 0.4);
    world.windowBranches.add(taperedTube([new THREE.Vector3(5, 2.9, z + dz - 1), new THREE.Vector3(2.6, 1.8, z + dz),
      new THREE.Vector3(HW, 1.55, z + dz * 0.5), tip], 0.1, 0.02, 12, 5));
    for (let k = 0; k < 2; k++) {
      const lf = part('leaves', 0, 0, 0, rng() * 6, world.windowBranches);
      lf.position.copy(tip).add(new THREE.Vector3((rng() - 0.5) * 0.4, -0.3 + rng() * 0.2, (rng() - 0.5) * 0.5));
      lf.scale.setScalar(0.25 + rng() * 0.2);
    }
    const out = part('leaves', 3.2, 1.6, z + dz, rng() * 6, world.windowBranches); out.scale.setScalar(1.6);
  }

  // --- 2 楼起：被根堵住的门（左侧 i=6）
  world.blockedDoorRoots = part('rootMass', -HW + 0.05, 0, -(6 * M + M / 2), LEFT);
  world.blockedDoorRoots.add(part('moss', 0.2, 0, 0.4, 0, world.blockedDoorRoots));

  // --- 吊灯
  for (const z of [-3, -9, -15, -21, -27]) addLamp(0, H - 1, z);
  addLamp(0, STAIR_H - 1.4, -32);

  // --- 窗外天空 + 外部光
  world.sky = new THREE.Mesh(new THREE.PlaneGeometry(60, 12), new THREE.MeshBasicMaterial({ color: SKY.dusk.sky, fog: false }));
  world.sky.position.set(HW + 3, 3, -19); world.sky.rotation.y = -Math.PI / 2; scene.add(world.sky);
  world.sun = new THREE.DirectionalLight(SKY.dusk.light, 0.4); world.sun.position.set(10, 6, -10); scene.add(world.sun);

  // --- 2 楼谜题：窗下地上的光斑，把空花盆放进去
  const spotZ = -(7 * M + M / 2);
  world.sunPatch = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.1), new THREE.MeshBasicMaterial({ color: SKY.dusk.light, transparent: true, opacity: 0.18, depthWrite: false }));
  world.sunPatch.rotation.x = -Math.PI / 2; world.sunPatch.position.set(HW - 0.55, 0.006, spotZ); scene.add(world.sunPatch);
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.3, 1.1), proxyMat); hitBox.visible = false; hitBox.position.z = 0.15; // 光斑平面已旋转，局部 z 即世界向上
  world.sunPatch.add(hitBox); hitBox.rotation.x = Math.PI / 2;
  makeInteractable(world.sunPatch,
    () => state.floor === 2 && state.picked.has('pot') && !state.potPlaced ? 'E　把空花盆放进光里' : '',
    placePot);
  world.placedPot = part('pot', HW - 0.55, 0, spotZ, 0.5); world.placedPot.visible = false;

  // --- 墙上字迹（左墙 z≈-9 附近，逐行出现）
  TEXT_LINES.forEach((t, i) => {
    const m = textPlane(t); m.position.set(-HW + 0.01, 1.85 - i * 0.28, -9.2 + i * 0.07); m.rotation.y = Math.PI / 2;
    m.visible = false; scene.add(m); world.texts.push(m);
  });

  // --- 道具
  world.chair = part('chair', -1.0, 0, -6, 0.4);
  addProp('cup', '倒扣的杯子', 0.8, 0, -12, 0.3);
  addProp('key', '钥匙', 0.8, 0, -12, 2.2);   // 1 楼谜题：钥匙扣在杯子下面
  addProp('frame', '空相框', HW - 0.12, 0, -17, RIGHT, -0.25);
  addProp('letter', '折叠的信', -0.6, 0, -20, 1.1);
  addProp('pot', '空花盆', -1.2, 0, -26.8, 0);
}

function addLamp(x, y, z) {
  const o = part('lamp', x, y, z);
  o.traverse(m => { if (m.isMesh) m.material = m.material.clone(); });
  const light = new THREE.PointLight('#f0d2a0', 6, 9, 1.6); light.position.set(x, y + 0.1, z); scene.add(light);
  world.lamps.push({ obj: o, light });
}
function setLamp(l, on) {
  l.light.visible = on;
  l.obj.traverse(m => { if (m.isMesh && m.material.emissive && m.material.emissiveIntensity !== undefined) m.material.emissiveIntensity = on ? 1 : 0; });
}

function addProp(name, label, x, y, z, rotY, tilt = 0) {
  const o = part(name, x, y, z, rotY);
  if (tilt) o.rotation.x = tilt; // 相框靠墙
  o.userData.pickup = { id: name, label };
  // 放大的不可见拾取判定球，小物件也容易瞄准
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 4), proxyMat);
  hit.visible = false; hit.position.y = 0.1; o.add(hit);
  const sprout = new THREE.Group(); sprout.position.set(x, 0, z);
  const rng = mulberry32(name.length * 97);
  for (let k = 0; k < 2; k++) {
    const a = rng() * Math.PI * 2, d = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
    sprout.add(taperedTube([0, 0.3, 0.7, 1].map((t, i) => d.clone().multiplyScalar(0.5 * t).setY([-0.05, 0.25, 0.2, -0.05][i])), 0.04, 0.02, 8, 5));
  }
  sprout.visible = false; scene.add(sprout);
  world.props[name] = o; world.sprouts[name] = sprout;
}

function textPlane(text) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 96;
  const g = cv.getContext('2d');
  g.fillStyle = C.ink; g.globalAlpha = 0.85; g.font = '56px "Songti SC","Noto Serif SC",serif'; g.textBaseline = 'middle';
  let x = 16; for (const ch of text) { g.save(); g.translate(x, 48 + (Math.random() - .5) * 6); g.rotate((Math.random() - .5) * 0.08); g.fillText(ch, 0, 0); g.restore(); x += g.measureText(ch).width + 4; }
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.3), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2 }));
}

/* =====================================================================
 * 8. 楼层 / 循环系统
 *    楼层 = 原设计的"循环 1-5"。解开本层谜题 → 楼梯顶的门打开 → 下一层；
 *    没解开 → 走到楼梯顶就回到本层起点，并随机出现一处细微异常。
 * ===================================================================*/
const FLOORS = {
  1: { lampsOff: [],    sky: 'dusk', texts: 0, blockedDoor: false, sprouts: false, railRoots: false, windowBranches: false, layoutShift: false },
  2: { lampsOff: [2],   sky: 'dusk', texts: 1, blockedDoor: true,  sprouts: false, railRoots: true,  windowBranches: false, layoutShift: false },
  3: { lampsOff: [2],   sky: 'noon', texts: 2, blockedDoor: true,  sprouts: true,  railRoots: true,  windowBranches: true,  layoutShift: false },
  4: { lampsOff: 'all', sky: 'noon', texts: 3, blockedDoor: true,  sprouts: true,  railRoots: true,  windowBranches: true,  layoutShift: true },
  5: { lampsOff: 'all', sky: 'noon', texts: 3, blockedDoor: true,  sprouts: true,  railRoots: true,  windowBranches: true,  layoutShift: true, final: true },
};
// 每层谜题：canOpen() 为真时楼梯顶的门可以打开
const PUZZLES = {
  1: { canOpen: () => state.picked.has('key'), openLabel: 'E　用钥匙开门' },
  2: { canOpen: () => state.potPlaced,         openLabel: 'E　开门' },
  3: { canOpen: () => true,                    openLabel: 'E　开门' },  // TODO: 3 楼谜题待设计
  4: { canOpen: () => true,                    openLabel: 'E　开门' },  // TODO: 4 楼谜题待设计
};
// 重复同一层时的细微异常（每次随机一个）
const ANOMALIES = {
  chairTurned:  () => { world.chair.rotation.y += Math.PI; },
  curtainMoved: () => { world.curtain.position.z = -(12 * M + M / 2) + 0.45; },
  extraRoot:    () => { world.extraRoot.visible = true; },
};
const state = {
  floor: 1, repeat: 0, anomaly: null,
  picked: new Set(),   // 背包里的
  gone: new Set(),     // 已从原位拿走的（捡起过就不再刷新）
  potPlaced: false, doorOpen: false, busy: false, ended: false,
};
const puzzle = () => PUZZLES[state.floor];

function applyFloor(n) {
  const L = FLOORS[n];
  world.lamps.forEach((l, i) => setLamp(l, !(L.lampsOff === 'all' || L.lampsOff.includes(i))));
  const s = SKY[L.sky];
  world.sky.material.color.set(s.sky); world.sun.color.set(s.light); world.sunPatch.material.color.set(s.light);
  world.windowLights.forEach(l => { l.color.set(s.light); l.intensity = s.intensity * (L.lampsOff === 'all' ? 1.3 : 1); });
  hemi.intensity = L.lampsOff === 'all' ? 0.2 : 0.35;
  world.texts.forEach((t, i) => t.visible = i < L.texts);
  world.blockedDoorRoots.visible = L.blockedDoor;
  world.railRoots.visible = L.railRoots;
  world.windowBranches.visible = L.windowBranches;
  world.placedPot.visible = state.potPlaced;
  for (const id in world.props) {
    world.props[id].visible = !state.gone.has(id) && (id !== 'key' || state.gone.has('cup'));
    world.sprouts[id].visible = L.sprouts && state.gone.has(id);
  }
  // 树又长了一点
  const grow = 1 + 0.12 * (n - 1);
  world.roots.forEach(g => g.scale.setScalar(grow));
  world.trunk.scale.set(1 + 0.05 * (n - 1), 1, 1 + 0.05 * (n - 1));
  // 布局微变
  world.swapDoor.visible = !L.layoutShift; world.swapWall.visible = L.layoutShift;
  if (L.layoutShift) { world.chair.position.set(0, 0, -14); world.chair.rotation.y = 0; }
  else { world.chair.position.set(-1.0, 0, -6); world.chair.rotation.y = 0.4; }
  // 门重新锁上
  state.doorOpen = false;
  world.landingDoor.visible = true; world.landingDoorOpen.visible = false; world.doorCollider.enabled = true;
  setFloorSign(n);
  // 异常：先复位，重复时再随机挑一个
  world.curtain.position.z = -(4 * M + M / 2) + 0.45; world.extraRoot.visible = false;
  state.anomaly = null;
  if (state.repeat > 0) {
    const names = Object.keys(ANOMALIES);
    state.anomaly = names[Math.floor(Math.random() * names.length)];
    ANOMALIES[state.anomaly]();
  }
  updateInv();
}

function setFloorSign(n) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = '#3d3832'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#b9b2a2'; g.font = '40px Georgia,serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(n >= 5 ? '?' : String(n), 32, 34);
  const m = world.floorSign.material; m.map?.dispose(); m.map = new THREE.CanvasTexture(cv); m.map.colorSpace = THREE.SRGBColorSpace; m.needsUpdate = true;
}

function doorLabel() {
  const pz = puzzle();
  if (!pz || state.doorOpen) return '';
  return pz.canOpen() ? pz.openLabel : '锁着';
}
function tryOpenDoor() {
  const pz = puzzle();
  if (!pz || state.doorOpen || !pz.canOpen()) return;
  state.doorOpen = true;
  world.landingDoor.visible = false; world.landingDoorOpen.visible = true; world.doorCollider.enabled = false;
  Platform.emit('use', { target: 'door', floor: state.floor, item: state.floor === 1 ? 'key' : null });
}
function placePot() {
  if (state.floor !== 2 || !state.picked.has('pot') || state.potPlaced) return;
  state.picked.delete('pot'); state.potPlaced = true; world.placedPot.visible = true;
  Platform.emit('use', { target: 'sunPatch', floor: state.floor, item: 'pot' });
  updateInv();
}

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
async function transition(fn, white = false) {
  state.busy = true;
  $('fade').classList.toggle('white', white); $('fade').style.opacity = 1; await wait(1300);
  fn(); resetPlayer();
  await wait(400); $('fade').style.opacity = 0; state.busy = false;
}
function repeatFloor() {
  if (state.busy || state.ended) return;
  transition(() => { state.repeat++; applyFloor(state.floor); Platform.emit('repeat', { floor: state.floor, repeat: state.repeat }); });
}
function nextFloor() {
  if (state.busy || state.ended) return;
  transition(() => { state.floor++; state.repeat = 0; applyFloor(state.floor); Platform.emit('floor', { floor: state.floor }); });
}
async function endGame() {
  // TODO: 顶层树冠区 + 爬主干到树顶。当前占位：到楼梯顶直接结束
  if (state.busy || state.ended) return;
  state.busy = state.ended = true;
  Platform.emit('end', { floor: state.floor, endingItem: state.gone.has(ENDING_ITEM) });
  $('fade').classList.add('white'); $('fade').style.opacity = 1;
  await wait(1400); $('end').style.display = 'flex'; document.exitPointerLock?.();
}

/* =====================================================================
 * 9. 第一人称控制
 * ===================================================================*/
const player = { pos: new THREE.Vector3(), vy: 0, yaw: 0, pitch: 0, onGround: true };
function resetPlayer() { player.pos.set(0, 0, -1.2); player.vy = 0; player.yaw = 0; player.pitch = 0; }

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (DEBUG && /^Digit[1-5]$/.test(e.code)) { state.floor = +e.code.slice(5); state.repeat = 0; applyFloor(state.floor); resetPlayer(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let playing = false, dragLook = false, dragging = false;
const canvas = renderer.domElement;
function look(dx, dy) {
  player.yaw -= dx * CFG.lookSens;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * CFG.lookSens));
}
addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas || (dragLook && dragging)) look(e.movementX, e.movementY);
});
canvas.addEventListener('mousedown', e => { if (dragLook) dragging = true; if (playing && e.button === 0) tryInteract(); });
addEventListener('mouseup', () => { dragging = false; });

$('start').addEventListener('click', () => {
  if (!ready || state.ended) return;
  try { const p = canvas.requestPointerLock(); if (p?.catch) p.catch(() => enableDragLook()); } catch { enableDragLook(); }
  startPlaying();
});
function startPlaying() {
  playing = true; $('start').style.display = 'none';
  if (!started) { started = true; $('fade').style.opacity = 0; Platform.emit('start', { floor: state.floor }); }
}
function enableDragLook() { dragLook = true; startPlaying(); } // iframe 不允许 pointer lock 时，按住拖拽转视角
document.addEventListener('pointerlockerror', enableDragLook);
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas && !dragLook && !state.ended) {
    playing = false; $('start').style.display = 'flex'; $('startText').textContent = '点击继续';
  }
});

const down = new THREE.Vector3(0, -1, 0), ray = new THREE.Raycaster();
function groundAt(x, y, z) {
  ray.set(new THREE.Vector3(x, y + CFG.stepHeight, z), down); ray.far = 50;
  const hit = ray.intersectObjects(walkables, false)[0];
  return hit ? hit.point.y : -Infinity;
}
function collide(p) {
  const r = CFG.radius, y0 = p.y + 0.2, y1 = p.y + 1.7;
  for (const c of colliders) {
    if (!c.enabled || y1 < c.minY || y0 > c.maxY) continue;
    const cx = Math.max(c.minX, Math.min(p.x, c.maxX)), cz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
    else { // 中心已进入盒内：沿最短轴推出
      const opts = [[c.minX - r - p.x, 0], [c.maxX + r - p.x, 0], [0, c.minZ - r - p.z], [0, c.maxZ + r - p.z]];
      opts.sort((a, b) => Math.abs(a[0] + a[1]) - Math.abs(b[0] + b[1])); p.x += opts[0][0]; p.z += opts[0][1];
    }
  }
}

function updatePlayer(dt) {
  const p = player.pos;
  if (playing && !state.busy) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (f || s) {
      const sp = (keys.ShiftLeft || keys.ShiftRight ? CFG.runSpeed : CFG.walkSpeed) * dt / Math.hypot(f, s);
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      p.x += (-sy * f + cy * s) * sp; p.z += (-cy * f - sy * s) * sp;
      collide(p);
    }
  }
  const gy = groundAt(p.x, p.y, p.z);
  if (p.y <= gy || (player.onGround && p.y - gy < CFG.stepHeight)) { p.y = gy; player.vy = 0; player.onGround = true; }
  else {
    player.vy -= CFG.gravity * dt; p.y += player.vy * dt; player.onGround = false;
    if (p.y < gy) { p.y = gy; player.vy = 0; player.onGround = true; }
  }
  if (p.y < -10) resetPlayer();
  // 轻微步伐起伏
  const moving = playing && (keys.KeyW || keys.KeyS || keys.KeyA || keys.KeyD);
  bob += moving ? dt * 7 : 0;
  camera.position.set(p.x, p.y + CFG.eyeHeight + Math.sin(bob) * 0.025, p.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  // 楼梯顶：顶层 → 结局；门开着走进去 → 下一层；谜题没解开 → 回到本层起点
  if (p.y > H - 0.3) {
    if (FLOORS[state.floor].final) { if (p.z < -35.8) endGame(); }
    else if (state.doorOpen && p.z < Z_END - 0.4) nextFloor();
    else if (!puzzle().canOpen() && p.z < -35.8) repeatFloor();
  }
}
let bob = 0;

/* =====================================================================
 * 10. 拾取
 * ===================================================================*/
const center = new THREE.Vector2(0, 0);
let focused = null;
function findFocus() {
  ray.setFromCamera(center, camera); ray.far = CFG.reach;
  const targets = [...Object.values(world.props), ...interactables].filter(o => o.visible);
  const hit = ray.intersectObjects(targets, true)[0];
  let o = hit?.object; while (o && !o.userData.pickup && !o.userData.interact) o = o.parent;
  const label = !o ? '' : o.userData.pickup ? `E　拾取　${o.userData.pickup.label}` : o.userData.interact.label();
  focused = label ? o : null;
  const el = $('prompt');
  if (label) el.textContent = label;
  el.style.opacity = label && playing ? 0.85 : 0;
}
function tryInteract() {
  if (!playing || !focused || state.busy) return;
  if (!focused.userData.pickup) { focused.userData.interact.act(); focused = null; return; }
  const { id, label } = focused.userData.pickup;
  focused.visible = false; state.gone.add(id); state.picked.add(id); focused = null;
  if (id === 'cup' && !state.gone.has('key')) world.props.key.visible = true; // 杯子下面露出钥匙
  Platform.emit('pickup', { id, label, floor: state.floor });
  updateInv();
}
function updateInv() {
  $('inv').innerHTML = [...state.picked].map(id => world.props[id].userData.pickup.label).join('<br>');
}

/* =====================================================================
 * 11. 主循环
 * ===================================================================*/
let ready = false, started = false;
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePlayer(dt);
  if (playing) findFocus();
  // 灯微微闪（3 楼起）
  if (state.floor >= 3) world.lamps.forEach(l => { if (l.light.visible) l.light.intensity = 6 * (0.9 + Math.random() * 0.1); });
  renderer.render(scene, camera);
  if (DEBUG) {
    const p = player.pos;
    $('hud').textContent = `floor ${state.floor}  repeat ${state.repeat}  anomaly ${state.anomaly}  door ${state.doorOpen ? 'open' : puzzle()?.canOpen() ? 'unlocked' : 'locked'}\n` +
      `pos ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}  picked [${[...state.picked]}]  calls ${renderer.info.render.calls}  [1-5] 跳楼层`;
  }
  requestAnimationFrame(tick);
}

(async () => {
  if (DEBUG) { $('hud').style.display = 'block'; window.__game = { player, state, world, applyFloor }; }
  await loadAssets();
  buildLevel(); applyFloor(1); resetPlayer();
  ready = true; $('startText').textContent = '点 击 进 入';
  Platform.emit('ready');
  tick();
})();
</script>
</body>
</html>
