<html lang="en">

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1d1e; color: #d6d0c2;
    font-family: Georgia, "Times New Roman", serif; user-select: none; }
  canvas { display: block; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #start { display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(18,18,18,.9); pointer-events: auto; cursor: pointer; text-align: center; gap: 18px; }
  #start { background: linear-gradient(rgba(8,9,12,.8), rgba(8,9,12,.88)), url(assets/tex/keyart.jpg) center / cover, #121212; }
  #start.paused, #start.open.paused { background: rgba(10,11,14,.42); -webkit-backdrop-filter: blur(10px) brightness(.85); backdrop-filter: blur(10px) brightness(.85); }
  #restart { display: none; font: inherit; color: inherit; background: none; border: 1px solid rgba(214,208,194,.45); padding: 7px 18px; cursor: pointer; letter-spacing: .12em; font-size: 14px; }
  #restart:hover { border-color: rgba(214,208,194,.9); }
  #start.paused #restart { display: block; }
  #pauseBtn { position: absolute; right: 18px; top: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(214,208,194,.5); background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; font-size: 16px; letter-spacing: 2px; }
  #start.open { background: linear-gradient(rgba(8,9,12,.25), rgba(8,9,12,.6)), url(assets/tex/keyart.jpg) center / cover, #121212; }

  #start p { margin: 0; opacity: .7; font-size: 14px; line-height: 1.9; }
  #start .go { opacity: .95; font-size: 16px; letter-spacing: .3em; }

    border-radius: 50%; background: #d6d0c2; opacity: .55; position: fixed; }
  #prompt { top: auto; bottom: 26%; text-align: center; font-size: 15px; letter-spacing: .15em; opacity: 0; transition: opacity .2s; }
  #subtitle { top: auto; bottom: 12%; left: 10%; right: 10%; text-align: center; font-size: 19px; line-height: 1.7;
    letter-spacing: .08em; opacity: 0; transition: opacity .6s; text-shadow: 0 0 8px #000, 0 0 2px #000; }
  #fade { background: #f4f2ec; opacity: 0; transition: opacity 1.6s ease; }
  #end { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; color: #3a3530; }
  #end .t { font-size: 26px; letter-spacing: .8em; }

  #end .t, #end #stats, #end #again { opacity: 0; transition: opacity 1.5s; }
  #end #again { font-size: 14px; letter-spacing: .25em; cursor: pointer; pointer-events: auto; }
  #monologue { position: absolute; left: 12%; right: 12%; top: 50%; transform: translateY(-50%); text-align: center; font-size: 21px; line-height: 1.8; letter-spacing: .06em; opacity: 0; transition: opacity 1.4s; }
  #scope { background: radial-gradient(circle at 50% 50%, transparent 0 33vmin, #000 34vmin); opacity: 0; transition: opacity .5s; }
  #mp { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; opacity: .8; }
  #mp button { font: inherit; color: inherit; background: none; border: 1px solid rgba(214,208,194,.35); padding: 6px 14px; cursor: pointer; letter-spacing: .08em; }
  #mp button:hover { border-color: rgba(214,208,194,.8); }
  #mp input { font: inherit; width: 6em; text-align: center; letter-spacing: .3em; text-transform: uppercase; background: rgba(0,0,0,.3); color: inherit; border: 1px solid rgba(214,208,194,.5); padding: 5px; }

  /* 触屏：左半屏拖出摇杆，右半屏拖动转视角，能交互时出现 Use 按钮；竖屏时提示横过来 */
  #touch { display: none; pointer-events: auto; touch-action: none; }
  #stickBase { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 1px solid rgba(214,208,194,.3); background: rgba(0,0,0,.12); }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(214,208,194,.32); }

    border: 1px solid rgba(214,208,194,.7); background: rgba(0,0,0,.3); font-size: 15px; letter-spacing: .15em; opacity: 0; transition: opacity .2s; }
  #useBtn.on { opacity: 1; }
  #rotate { display: none; z-index: 10; background: #121212; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    pointer-events: auto; font-size: 17px; letter-spacing: .15em; text-align: center; }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  body.touch #subtitle { font-size: 16px; bottom: 8%; }
  body.touch #prompt { bottom: 30%; }
  #hint { top: 7%; bottom: auto; text-align: center; font-size: 15px; letter-spacing: .12em; opacity: 0; transition: opacity .6s; text-shadow: 0 0 6px #000; }
  #controls { inset: 18px auto auto 20px; font-size: 13px; line-height: 1.9; letter-spacing: .08em; opacity: 0; transition: opacity 1s; text-shadow: 0 0 6px #000; }
  #hud { inset: 8px auto auto 8px; font: 12px/1.5 ui-monospace, monospace; color: #9f9; white-space: pre; display: none; }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const DEBUG = new URLSearchParams(location.search).has('debug');
// 触屏设备（手机、平板）：换成虚拟摇杆操作，并降低画质保流畅；?touch 可在桌面上强制打开
const TOUCH = new URLSearchParams(location.search).has('touch') || (matchMedia('(pointer: coarse)').matches && 'ontouchstart' in window);
const CLICK = TOUCH ? 'Tap' : 'Click';

/* =====================================================================
 * 1. 设计数据（对应设计文档）
 * ===================================================================*/
const CFG = {
  eyeHeight: 1.6, radius: 0.3, walkSpeed: 2.0, runSpeed: 3.2,
  gravity: 20, stepHeight: 0.45, lookSens: 0.0022, reach: 2.3,
};

// 每层要找的「钥匙」和可用的谜题模板
const FLOORS = {
  1: { keys: ['photo'], pool: ['misplaced'] },
  2: { keys: ['lamp', 'radio'], pool: ['misplaced', 'twin', 'behind', 'dark'] },
  3: { keys: ['poster', 'tickets', 'machine'], pool: ['twin', 'behind', 'dark', 'sound', 'doors', 'combo', 'window'] },
  4: { keys: ['housekey', 'can'], pool: ['sound', 'doors', 'combo', 'order', 'window'] },
  5: { rooftop: true },
};
// name：交互提示里的名字；text：拿到时的字幕；note：过渡房间墙上对应的便条（没拿到时字迹模糊）
const KEYS = {
  photo:    { name: 'family photo',      note: ['Photo:', 'hung'],         text: 'One face is missing from the photo.' },
  lamp:     { name: 'lamp',              note: ['Lamp:', 'on'],            text: 'A lamp left on in the window. Someone is waiting.' },
  radio:    { name: 'radio',             note: ['Radio:', 'on'],           text: '"…the dykes have failed. All residents must evacuate immediately…"' },
  poster:   { name: 'flyer',             note: ['Flyers:', 'again'],       text: '"MISSING. Last seen age 16…" The name has washed away.' },
  tickets:  { name: 'ferry tickets',     note: ['Tickets:', 'kept'],       text: 'On the back: "Went to the ferry again today. Still no word from you."' },
  machine:  { name: 'answering machine', note: ['Message:', 'heard'],      text: '"Everyone\'s left. I\'m staying — in case you come home and can\'t find us."' },
  housekey: { name: 'house key',         note: ['Key:', 'on the string'],  text: 'The key on the string. Still there.' },
  can:      { name: 'watering can',      note: ['Can:', 'filled'],         text: 'A note on it: "I planted the seed you found when you were little. When it\'s grown, come home."' },
};
const LINES = {
  success: {
    1: 'The empty face in the photo… that\'s me. I grew up here.',
    2: 'She left a light on for me. And outside… the whole town is under water.',
    3: 'I thought I was the one looking for her. She was looking for me all along.',
    4: 'The door was never locked. Someone kept watering the flowers. …Time to go home.',
  },
  hint: {
    1: ['Something\'s missing from those photos.', 'Was this hallway always like this?'],
    2: ['Something here isn\'t where it belongs.', 'Is that a radio?'],
    3: ['The ferry… how many times did she go?', 'Whose face is on all those flyers?'],
    4: ['Didn\'t we keep a key behind the letterbox?', 'The soil is still damp.'],
  },
  confused: ['…No. Not that.', 'What did I just touch?', 'It\'s getting harder to remember.', 'Have I been here before?', 'My head hurts.'],
};
const WALL_NOTES = ['Dear ___,', 'The door\'s open.', 'I watered the plants.', 'Come home.']; // 母亲的便条：2 楼起出现，每层多一行

// 一楼暗冷的蓝灰 → 四楼温暖、鲜艳
const PAL0 = { wall: '#4d5864', floor: '#343c46', ceil: '#59636f', trim: '#3c4550', furn: '#46505b', key: '#8d99a6',
  root: '#29303a', plant: '#44524f', sea: '#34424e', sky: '#1d242c', rug: '#34363d' };
const PAL1 = { wall: '#ecc996', floor: '#a06a3a', ceil: '#f5e0bc', trim: '#b0743c', furn: '#b87a40', key: '#f2b445',
  root: '#6e4a28', plant: '#7cb847', sea: '#1c7397', sky: '#f2cf9c', rug: '#a8452e' };
const HEMI0 = '#9fb3c8', HEMI1 = '#ffe0b0';   // 环境光也从冷变暖
// 每层的光与雾；到新楼层后几秒内平滑过渡
const LOOK = {
  1: { f: 0,    lamp: 5.4, lampColor: '#b9cae0', sun: 0.40, hemi: 0.48, env: 0.30, fog: [6, 24], flicker: true },
  2: { f: 0.25, lamp: 5.4, lampColor: '#dcd6c8', sun: 0.60, hemi: 0.50, env: 0.34, fog: [7, 32] },
  3: { f: 0.55, lamp: 5.6, lampColor: '#f3d3a4', sun: 0.90, hemi: 0.54, env: 0.38, fog: [8, 42] },
  4: { f: 1,    lamp: 5.8, lampColor: '#ffc585', sun: 1.20, hemi: 0.60, env: 0.42, fog: [9, 55] },
  5: { f: 1,    lamp: 5.8, lampColor: '#ffc585', sun: 2.20, hemi: 1.00, env: 0.70, fog: [25, 430], sky: '#b4d6e6' },
};
// 每把「钥匙」只出现在跟它有关的摆放点（鞋柜=门口，电话桌、边桌、纸箱……）
const KEY_SPOTS = { photo: [3, 2, 6], lamp: [2, 4, 8], radio: [6, 2, 4], poster: [5, 7, 3],
  tickets: [1, 6, 8], machine: [6, 2, 4], housekey: [1, 7, 8], can: [5, 7, 4] };

/* =====================================================================
 * 2. 平台适配层：所有与 Chrona 相关的调用集中在这里（待确认 API 后接入）
 * ===================================================================*/
const Platform = {
  emit(evt, detail = {}) {
    if (DEBUG) console.log('[platform]', evt, detail);
    window.dispatchEvent(new CustomEvent('root:' + evt, { detail }));
  },
};

/* =====================================================================
 * 3. 渲染基础
 * ===================================================================*/
const renderer = new THREE.WebGLRenderer({ antialias: !TOUCH });
renderer.setPixelRatio(new URLSearchParams(location.search).has('lowgfx') ? 0.3 : Math.min(devicePixelRatio, TOUCH ? 1 : 1.5));   // ?lowgfx：自动测试用（软件渲染太慢）
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL0.sky);
scene.fog = new THREE.Fog(PAL0.sky, 5, 22);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 900);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const hemi = new THREE.HemisphereLight('#c8ccd0', '#2a2622', 0.3); scene.add(hemi);
// 环境光照：模型有了明暗层次，不再是平涂；强度按楼层在 updateLook 里变
// 用自己搭的"房间"（顶灯 + 四面一样的侧光），绕竖轴每转 90° 都一样 —— 出口楼梯是入口楼梯转 90° 的复制品，两边光照必须完全相同
{
  const env = new THREE.Scene(), basic = (c, k = 1) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide });
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 6, 10), new THREE.MeshBasicMaterial({ color: '#6d6862', side: THREE.BackSide })).translateY(2));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), basic('#2e2a26')); floor.rotation.x = -Math.PI / 2; floor.position.y = -0.95; env.add(floor);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), basic('#ffffff', 3)); top.rotation.x = Math.PI / 2; top.position.y = 4.9; env.add(top);
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2, w = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.6), basic('#e4ddd0', 1.6)); w.position.set(Math.sin(a) * 4.9, 2.4, Math.cos(a) * 4.9); w.lookAt(0, 2.4, 0); env.add(w); }
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(env, 0.04).texture; pm.dispose();
}
scene.environmentIntensity = 0.25;
// 楼内用正上方的平行光：墙面不受朝向影响，楼梯两端的复制品才看起来完全一样
const sun = new THREE.DirectionalLight('#fff1d8', 0.3); sun.position.set(0, 50, 0); scene.add(sun);

/* =====================================================================
 * 4. 材质与几何工具
 * ===================================================================*/
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: true, ...o });
const M = {};
for (const k in PAL0) M[k] = std(PAL0[k]);
M.dark = std('#101010');
M.glowKey = std('#fff4d0', { emissive: '#ffd27a', emissiveIntensity: 1.4 });
M.white = std('#f2f2f2');
M.flower = [std('#e0a0a8'), std('#f1d06a'), std('#c9a6e0'), std('#f3f0e6')];
const _c0 = {}, _c1 = {};
for (const k in PAL0) { _c0[k] = new THREE.Color(PAL0[k]); _c1[k] = new THREE.Color(PAL1[k]); }
const greenMats = [];   // Meshy 树根和植物的共用材质：跟着楼层冷暖变（1 楼压暗偏冷，4 楼原色）
const _g0 = new THREE.Color(0.5, 0.56, 0.66), _g1 = new THREE.Color(1, 1, 1);
function applyPalette(f) { for (const k in PAL0) M[k].color.copy(_c0[k]).lerp(_c1[k], f); for (const m of greenMats) m.color.copy(_g0).lerp(_g1, f); }

const building = new THREE.Group(); scene.add(building);   // 1–4 楼共用的空间
const puzzleGroup = new THREE.Group(); building.add(puzzleGroup);
const roof = new THREE.Group(); scene.add(roof);           // 楼顶天台（4 楼上楼后出现）

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  if (parent) parent.add(m); return m;
}
function group(...kids) { const g = new THREE.Group(); kids.forEach(k => g.add(k)); return g; }
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let rand = Math.random;   // 抽谜题时换成带种子的随机数，联机时两边抽到的一样
const pick = a => a[Math.floor(rand() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// 锥形管（树根/树枝）
function taperedTube(points, r0, r1, mat, seg = 12, radial = 5) {
  const curve = new THREE.CatmullRomCurve3(points);
  const frames = curve.computeFrenetFrames(seg, false), pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, p = curve.getPointAt(t), r = r0 + (r1 - r0) * t, N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(p.x + r * (c * N.x + s * B.x), p.y + r * (c * N.y + s * B.y), p.z + r * (c * N.z + s * B.z));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial; idx.push(a, b, a + radial, b, b + radial, a + radial);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return new THREE.Mesh(g, mat);
}

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
function textTexture(lines, { w = 512, h = 128, font = 56, color = '#2b2521', bg = null } = {}) {
  return canvasTex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.fillStyle = color; g.font = `${font}px "Georgia","Times New Roman",serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((t, i) => g.fillText(t, w / 2, h / (lines.length + 1) * (i + 1)));
  });
}
// 被水泡过、看不清的字
function smudgeTexture(seed) {
  const rng = mulberry32(seed);
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#d9d1bd'; g.fillRect(0, 0, w, h);
    g.filter = 'blur(3px)'; g.strokeStyle = 'rgba(60,50,44,.7)'; g.lineWidth = 7;
    for (let k = 0; k < 4; k++) { g.beginPath(); let x = 30 + k * 50; g.moveTo(x, 64);
      for (let i = 0; i < 6; i++) g.lineTo(x += 7, 64 + (rng() - 0.5) * 40); g.stroke(); }
    g.filter = 'none'; g.fillStyle = 'rgba(120,110,95,.25)'; g.beginPath(); g.arc(150, 70, 45, 0, 7); g.fill();
  });
}

// 走廊墙面：下半截裸红砖 + 深色木踢脚 / 腰线，上半截白灰泥；灰泥剥落按楼层从重到无（1 楼最破，4 楼干净）
// 贴图按米铺（uv = 局部坐标，见 meterUV），楼梯口复制品用同样的局部坐标，所以两边看到的一模一样
const WALL_W = 6, PPM = 1024 / WALL_W;   // 一张贴图 6 m × 3 m
let _brick = null;
function brickLayer() { // 整面墙高的砖（剥落处露出来的也是同一层砖），横向首尾相接
  if (_brick) return _brick;
  const cv = _brick = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const g = cv.getContext('2d'), rng = mulberry32(77), bw = 0.24 * PPM, bh = 0.075 * PPM;
  g.fillStyle = '#c4b8a6'; g.fillRect(0, 0, 1024, 512);
  const reds = ['#8e4a37', '#9a5540', '#7f4231', '#a35b45', '#874634', '#94503b'];
  for (let r = 0; r < 40; r++) for (let c = -1; c < 26; c++) {
    const x = c * bw + (r % 2) * bw / 2, y = r * bh;
    g.fillStyle = reds[Math.floor(rng() * reds.length)]; g.fillRect(x + 1.5, y + 1.5, bw - 3, bh - 3);

  for (const [w, h, x, y] of [[W, t, 0, (H2 - t) / 2], [W, t, 0, -(H2 - t) / 2], [t, H2, -(W - t) / 2, 0], [t, H2, (W - t) / 2, 0]]) box(w, h, d, wood, x, y, d / 2, g);

// 本层还没归位的「钥匙」在归位处留一个淡淡的空位；手里有的走过去按 E 放回
function buildRoomKeys() {
  box(0.35, 0.03, 0.5, M.furn, 18.68, 1.0, -21.2, building);                 // 放答录机的搁板
  world.roomKeys = {}; world.slots = {}; world.reveals = [];
  const ghost = new THREE.MeshBasicMaterial({ color: '#efe7d2', transparent: true, opacity: 0.16, depthWrite: false });
  for (const id in ROOM_SPOTS) {
    const s = ROOM_SPOTS[id];
    for (const kind of ['key', 'slot']) {
      const o = id === 'photo' ? wallFrame() : makeKey(id, 'real'); o.rotation.order = 'YXZ';
      o.position.set(...s.p); o.rotation.set(s.rx || 0, s.ry, 0); o.visible = false; building.add(o);
      if (kind === 'key') { world.roomKeys[id] = o; continue; }
      o.traverse(m => { if (m.isMesh && m.material !== proxyMat) m.material = ghost; });
      o.userData.interact = { label: () => state.phase === 'room' && state.keysGot.has(id) && !state.placed.has(id) ? `E   Put back the ${KEYS[id].name}` : '', act: () => placeKey(id) };
      permTargets.push(o); world.slots[id] = o;
    }
  }
}
function placeKey(id) {
  state.placed.add(id); world.slots[id].visible = false;
  const o = world.roomKeys[id]; o.visible = true; o.scale.setScalar(0.001); world.reveals.push({ o, t0: performance.now(), done: false });
  Platform.emit('place', { id, floor: state.floor });
}
function updateReveals() {
  const now = performance.now();
  for (const r of world.reveals) {
    const k = Math.min(1, Math.max(0, (now - r.t0) / 700)), e = 1 - Math.pow(1 - k, 3);
    r.o.scale.setScalar(Math.max(0.001, e));
    if (k > 0 && !r.done) { r.done = true; if (audio) sfx.chime(r.o.getWorldPosition(V(0, 0, 0))); }
  }
  world.reveals = world.reveals.filter(r => now - r.t0 < 800);
  const m = world.roomKeys.machine; if (m.visible) m.userData.blink.material.emissiveIntensity = Math.sin(now / 180) > 0 ? 2.5 : 0;
}

function applyRoomNotes(n) {
  world.home.sheets.visible = n === 1;
  for (const o of world.home.under) o.visible = n !== 1;   // 盖着布的那一层，布下面的家具不显示（盖布模型本身就是家具的形状）

  for (const id in world.roomKeys) { const o = world.roomKeys[id]; o.visible = state.recovered.has(id); o.scale.setScalar(1); world.slots[id].visible = false; }
  world.notes.forEach((m, i) => m.visible = n >= 2 && i < n);   // 「Dear ___,」+ 每层多一行
  const rf = world.roomFurn; rf.table.visible = rf.table.userData.col.enabled = n >= 2;

let lookTo = null;
function lookTarget(n) {

}
function setLook(n, instant) { lookTo = lookTarget(n); if (instant) updateLook(0, true); }

  if (state.scope) { scene.fog.near = 60; scene.fog.far = 400; }  // 望远镜里看得清
  for (const m of world.fogPlanes || []) { m.visible = !state.scope && !state.roofMode; m.material.color.copy(look.sky).lerp(_fogWhite, 0.35); }   // 天台上看不到楼下的窗
  for (const m of world.glass || []) m.visible = !state.scope && !state.roofMode;   // 望远镜里看得清
  hemi.intensity = state.lightsOn ? look.hemi : Math.min(look.hemi, 0.1); scene.environmentIntensity = state.lightsOn ? look.env : 0.04; hemi.color.copy(_h0).lerp(_h1, look.f); sun.intensity = look.sun;
  const flick = t.flicker && state.floor === 1;
  world.lamps.forEach((l, i) => {
    l.light.color.copy(look.lampColor);   // 关灯用亮度 0，不隐藏：灯的数量一变所有材质都要重新编译，会卡一下
    l.light.intensity = state.lightsOn ? look.lamp * (flick && Math.random() < 0.015 ? 0.35 : 1) : 0;

  const take = (Tp, id) => {

// 孩子：母亲指着的那把「钥匙」上亮起一束暖光
function showBeam(id) {
  const p = state.puzzles.find(q => q.id === id); if (!p?.obj || state.keysGot.has(id)) return;
  const v = p.obj.getWorldPosition(V(0, 0, 0));
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.3, 3.2, 12, 1, true),
    new THREE.MeshBasicMaterial({ color: '#ffd890', transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  m.position.set(v.x, 1.5, v.z); building.add(m); net.beams.push({ m, t0: performance.now() });
  if (audio) sfx.chime(v);
  if (!net.told.beam) { net.told.beam = true; say('A warm light… like someone is showing me the way.', 3500); }
}
for (const id of ['mpHost', 'mpJoin']) $(id).addEventListener('pointerdown', () => { initAudio(); music.start(); menuOpen = true; $('start').classList.add('open'); });
$('mpHost').addEventListener('click', e => {
  e.stopPropagation(); if (net.role) return;
  const code = hostRoom();
  $('mpJoin').style.display = 'none'; $('mpHost').style.display = 'none';
  $('mpPanel').innerHTML = `Room code <b>${code}</b><br>The other player opens this world, chooses “Join as the mother” and types this code. You can start now — they can join any time.`;
});
$('mpJoin').addEventListener('click', e => {
  e.stopPropagation(); if (net.role) return;
  $('mpHost').style.display = 'none'; $('mpJoin').style.display = 'none';
  $('mpPanel').innerHTML = 'Room code <input id="mpCode" maxlength="4" autocomplete="off"> <button id="mpGo">Join</button>';
  const go = () => { const c = $('mpCode').value.trim().toUpperCase(); if (c.length !== 4) return; joinRoom(c, t => { $('mpPanel').textContent = t; }); };
  $('mpGo').addEventListener('click', go); $('mpCode').addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') go(); });
  $('mpCode').focus();
});

/* =====================================================================
 * 13. 调试（?debug）：1–5 跳楼层，K 拿齐本层钥匙
 * ===================================================================*/
function debugJump(n) {
  state.floor = state.next = state.prevFloor = n; state.keysGot.clear(); state.placed.clear(); state.wrong = false; state.deciding = false; setLights(true);
  state.roofMode = n === 5; world.stub.visible = world.upper.visible = !state.roofMode; roof.visible = state.roofMode;
  setDoor(world.entranceLeaf, true); setDoor(world.farLeaf, false);
  world.startDoor.visible = false; world.startDoor.userData.col.enabled = false;
  for (let k = 1; k < n; k++) FLOORS[k].keys.forEach(id => state.recovered.add(id));
  applyContent(n); applyRoomNotes(n); genPuzzles(n); setLook(n, true);
  if (n === 5) { state.phase = 'roof'; sun.position.set(30, 40, 20); player.pos.set(6, 3.2, -19); player.yaw = Math.PI / 2; }
  else { state.phase = 'corridor'; sun.position.set(0, 50, 0); spawn(); }
  net.sendFloor();
}
function debugCollectAll() { (FLOORS[state.floor].keys || []).forEach(k => state.keysGot.add(k)); }

/* =====================================================================
 * 14. 主循环
 * ===================================================================*/
const clock = new THREE.Clock();
function buildCity(R, fRing, live) {
  // 远处沉没的城镇：近处 4 栋是 3D 模型（120–200 米），更远的 6 栋是概念图做的立牌（230–330 米，始终朝着玩家），西面灯塔那边留空
  const rr = mulberry32(99), inst = {}, rings = [];
  const add = (id, x, z, sink) => { id = MODELS[id + 'Hi'] ? id + 'Hi' : id; const S = MODELS[id]?.size; if (!S) return;
    (inst[id] ||= []).push({ x, z, ry: Math.atan2(12 - x, -9 - z) + (rr() - 0.5) * 0.4, y: SEA_Y - S.y * sink, tx: (rr() - 0.5) * 0.03, tz: (rr() - 0.5) * 0.03 });
    rings.push([x, z, Math.max(S.x, S.z) * 0.55]); };
  const NEAR = [['cityRow', 128, -86, 0.24], ['cityBridge', 104, -110, 0.18], ['cityChurch', 172, 28, 0.2], ['cityWarehouse', -18, -150, 0.24],
    ['cityFlat', 150, -150, 0.3], ['cityRow', 30, -175, 0.26], ['cityTower', 205, -40, 0.32], ['cityWarehouse', 158, 82, 0.25], ['cityRow', -10, 175, 0.26]];
  for (const [id, x, z, sink] of NEAR.slice(0, TOUCH ? 6 : NEAR.length)) add(id, x, z, sink);
  live.boards = [];
  for (const [id, x, z, h] of [['cityFlat', 40, -285, 40], ['cityTower', 300, -210, 56], ['cityRow', -130, -200, 20], ['cityFlat', -110, 265, 42], ['cityTower', 95, 300, 52], ['cityChurch', -175, 220, 42]]) {
    const im = IMG['bb_' + id]; if (!im) continue;
    const t = new THREE.Texture(im); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.needsUpdate = true;
    const w = h * im.width / im.height, m = new THREE.Mesh(new THREE.PlaneGeometry(w, h).translate(0, h / 2, 0), new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.35, side: THREE.DoubleSide }));
    m.position.set(x, SEA_Y - h * 0.04, z); R.add(m); live.boards.push(m); rings.push([x, z, w * 0.5]);
  }
  const e = new THREE.Euler(), q = new THREE.Quaternion(), one = V(1, 1, 1);
  for (const id in inst) {
    const M = MODELS[id], list = inst[id]; M.obj.updateMatrixWorld(true);
    M.obj.traverse(m => { if (!m.isMesh) return;
      const im = new THREE.InstancedMesh(m.geometry, m.material, list.length), local = m.matrixWorld.clone();
      list.forEach((t, i) => { q.setFromEuler(e.set(t.tx, t.ry, t.tz)); im.setMatrixAt(i, new THREE.Matrix4().compose(V(t.x, t.y, t.z), q, one).multiply(local)); });
      im.computeBoundingSphere(); R.add(im); });
  }
  const ring = new THREE.InstancedMesh(new THREE.PlaneGeometry(2.8, 2.8).rotateX(-Math.PI / 2), fRing, rings.length);   // 楼脚的浪花，也是一次画完
  rings.forEach(([x, z, r], i) => ring.setMatrixAt(i, new THREE.Matrix4().compose(V(x, SEA_Y + 0.3, z), q.setFromEuler(e.set(0, x * 7.1 + z, 0)), V(r, 1, r))));
  R.add(ring);
}
// 天台：云飘、漂浮物跟着浪、海鸥盘旋、浪花一明一暗
function updateRoof(dt) {
  const L = world.roofLive, t = seaTime.value;
  for (const c of L.clouds) { c.position.x += dt * 2.5; if (c.position.x > 540) c.position.x -= 1060; }
  for (const o of L.bob) { o.position.y = SEA_Y + waveH(o.position.x, o.position.z) - 0.25; o.rotation.x = Math.sin(t * 1.3 + o.position.x) * 0.08; o.rotation.z = Math.cos(t * 1.1 + o.position.z) * 0.08; }
  for (const g of L.gulls) {
    const u = g.userData; u.a += dt * u.sp; const s = Math.sign(u.sp);
    g.position.set(TREE.x + Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.4 + u.ph) * 1.5, TREE.z + Math.sin(u.a) * u.r);
    g.rotation.set(0, Math.atan2(-Math.sin(u.a) * s, Math.cos(u.a) * s), -0.25 * s);
    const flap = Math.sin(t * 0.5 + u.ph) > -0.3 ? Math.sin(t * 9 + u.ph) * 0.55 : 0.08;
    u.wings[0].rotation.z = flap; u.wings[1].rotation.z = -flap;
  }
  for (const r of L.rings) r.rotation.y += dt * 0.03;
  for (const b of L.boards || []) b.rotation.y = Math.atan2(camera.position.x - b.position.x, camera.position.z - b.position.z);   // 立牌转向玩家
  foamMats.forEach((m, i) => { m.opacity = 0.6 + 0.25 * Math.sin(t * 1.2 + i * 2); if (i === 0) m.map.offset.x = t * 0.02; });
}
// 过渡房间里一直提示该做什么；站着不动 3 秒左上角浮出操作说明
const CONTROLS = TOUCH ? 'Left thumb — move<br>Right thumb — look around<br>USE — pick up / open / put back'
  : 'W A S D — move<br>Shift — walk faster<br>Mouse — look around<br>E or Click — pick up / open / put back';
function updateHints() {
  let t = '';
  if (playing && state.phase === 'room' && !state.deciding && !state.ended && net.role !== 'mother') {
    const holding = FLOORS[state.floor].keys.some(k => state.keysGot.has(k) && !state.placed.has(k));
    t = holding ? 'Put back what you found. The faint outlines show where each thing belongs.' : 'When you are ready, open the far door.';
  }
  const h = $('hint'); if (t) h.textContent = t; h.style.opacity = t ? 0.85 : 0;
  const c = $('controls'), idle = playing && !state.ended && !state.scope && performance.now() - lastInput > 3000;
  if (idle && !c.innerHTML) c.innerHTML = CONTROLS; c.style.opacity = idle ? 0.75 : 0;
}
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  seaTime.value = performance.now() / 1000; updateDoors(dt);
  if (roof.visible) updateRoof(dt);
  updatePlayer(dt);
  net.update(dt);
  for (const p of state.puzzles) { if (net.role !== 'mother') p.update?.(dt); const led = p.obj?.userData.blink; if (led) led.material.emissiveIntensity = Math.sin(performance.now() / 180) > 0 ? 2.5 : 0; }
  ambience(dt); updateReveals();
  if (playing) findFocus();
  updateHints();
  updateLook(dt);
  updateListener();
  renderer.render(scene, camera);
  if (DEBUG) {
    const p = player.pos;
    $('hud').textContent = `floor ${state.floor}→${state.next}  phase ${state.phase}  keys ${[...state.keysGot]}  placed ${[...state.placed]}  wrong ${state.wrong}  lights ${state.lightsOn}\n` +
      `puzzles ${state.puzzles.map(q => `${q.id}:${q.tpl}@${q.anchors}`).join('  ')}\n` +
      `pos ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}  calls ${renderer.info.render.calls}  [1-5] jump to floor  [K] collect keys`;
  }
  requestAnimationFrame(tick);
}

(async () => {
  await Promise.all([loadModels(), loadImages()]);
  buildBuilding(); buildRoof();
  { // 预先编译所有着色器（含天台、楼梯口复制品等平时看不到的部分），避免第一次看到时卡一下
    const hidden = []; scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
    if (renderer.extensions.has('KHR_parallel_shader_compile')) await renderer.compileAsync(scene, camera); else renderer.compile(scene, camera);
    hidden.forEach(o => o.visible = false);
  }
  state.prevFloor = 1;
  setDoor(world.entranceLeaf, true); setDoor(world.farLeaf, false);
  applyContent(1); applyRoomNotes(1); genPuzzles(1); setLook(1, true); spawn();
  if (DEBUG) {
    $('hud').style.display = 'block';
    window.__game = { player, state, world, camera, T, Tinv, net, colliders, renderer, idleT: () => [performance.now() - lastInput, playing, !!state.scope, state.ended], debugJump, debugCollectAll, stairWarp, genPuzzles, forceTemplates: l => { state.forceTpl = l.slice(); } };
  }
  ready = true; $('startText').textContent = CLICK + ' to enter';
  Platform.emit('ready');
  tick();
})();
</script>
