<script type="module">
import * as THREE from 'three';

const DEBUG = new URLSearchParams(location.search).has('debug');

/* =====================================================================
 * 1. 设计数据（对应设计文档）
 * ===================================================================*/
const CFG = {

// 每层要找的「钥匙」和可用的谜题模板（数门、顺序、窗外尚未实现）
const FLOORS = {

  2: { keys: ['cup', 'radio'], pool: ['misplaced', 'twin', 'behind', 'dark'] },

// name：交互提示；text：拿到时的字幕；note：过渡房间墙上对应的便条（没拿到时字迹模糊）
const KEYS = {

  cup:      { name: '倒扣的杯子', note: '杯子 扣着',  text: '杯子倒扣着。有人在等谁回家。' },
  radio:    { name: '收音机',     note: '收音机 别关', text: '「……水位仍在上涨，请居民尽快撤离……」' },
  poster:   { name: '寻人启事',   note: '启事 又贴',  text: '「寻人：离家时 16 岁……」名字被水泡糊了。' },
  tickets:  { name: '船票存根',   note: '船票 收好',  text: '背面写着：「今天又去码头问了，还是没有你的消息。」' },
  machine:  { name: '答录机',     note: '留言 听了',  text: '「大家都搬走了。我不走，怕你回来找不到家。」' },
  housekey: { name: '家门钥匙',   note: '钥匙 挂着',  text: '钥匙一直挂在门边。' },
  can:      { name: '喷壶',       note: '喷壶 装满',  text: '「花盆里种了你小时候捡的那颗种子。等它长大，你就回来吧。」' },
};
const LINES = {
  success: {
    1: '照片上那张空着的脸……是我。我在这里长大。',
    2: '杯子扣着，是在等人回家。窗外……整座城都没了。',
    3: '我一直以为是我在找她。原来是她一直在找我。',
    4: '门从来没锁。花一直有人浇。……我该回家了。',
  },
  hint: {
    1: ['墙上的照片，好像少了点什么。', '这条走廊，刚才也是这样吗？'],
    2: ['有什么东西摆得不太对。', '是收音机的声音吗？'],
    3: ['码头……她是不是去过很多次？', '贴在墙上的纸，写的是谁？'],
    4: ['门边原来挂着什么来着？', '花，好像还是湿的。'],
  },
  confused: ['……不对，不是这个。', '我刚才碰了什么？', '好像越来越想不起来了。', '这里……我来过吗？', '头有点疼。'],
};
const WALL_NOTES = ['门 没锁', '花 浇了', '等你 回来']; // 2 楼起每层多一行

// 一楼灰色板 → 四楼彩色板
const PAL0 = { wall: '#6c6c6a', floor: '#4a4a48', ceil: '#767674', trim: '#525250', furn: '#5e5e5c', key: '#9a9a98',
  root: '#343230', plant: '#565c56', sea: '#586064', sky: '#2c2f31' };
const PAL1 = { wall: '#d6c7a6', floor: '#8a6a48', ceil: '#e4dac4', trim: '#9a7a56', furn: '#a27a54', key: '#e2b25e',
  root: '#5b4431', plant: '#6f9b4c', sea: '#3d8db0', sky: '#a9c8d4' };
// 每层的光与雾；到新楼层后几秒内平滑过渡
const LOOK = {
  1: { f: 0,    lamp: 3.8, lampColor: '#c6ccd2', sun: 0.30, hemi: 0.30, fog: [5, 22], flicker: true },
  2: { f: 0.3,  lamp: 4.1, lampColor: '#e2d4bc', sun: 0.55, hemi: 0.36, fog: [6, 30] },
  3: { f: 0.62, lamp: 4.3, lampColor: '#eedcbc', sun: 0.85, hemi: 0.44, fog: [7, 40] },
  4: { f: 0.9,  lamp: 4.8, lampColor: '#ffe2b2', sun: 1.20, hemi: 0.55, fog: [9, 55] },
  5: { f: 1,    lamp: 4.8, lampColor: '#ffe2b2', sun: 2.20, hemi: 1.00, fog: [80, 700], sky: '#9fd0ea' },
};

/* =====================================================================
 * 2. 平台适配层：所有与 Chrona 相关的调用集中在这里（待确认 API 后接入）
 * ===================================================================*/
const Platform = {
  emit(evt, detail = {}) {
    if (DEBUG) console.log('[platform]', evt, detail);
    window.dispatchEvent(new CustomEvent('root:' + evt, { detail }));
  },
};

/* =====================================================================
 * 3. 渲染基础
 * ===================================================================*/
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL0.sky);
scene.fog = new THREE.Fog(PAL0.sky, 5, 22);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 900);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const hemi = new THREE.HemisphereLight('#c8ccd0', '#2a2622', 0.3); scene.add(hemi);
// 楼内用正上方的平行光：墙面不受朝向影响，楼梯两端的复制品才看起来完全一样
const sun = new THREE.DirectionalLight('#fff1d8', 0.3); sun.position.set(0, 50, 0); scene.add(sun);

/* =====================================================================
 * 4. 材质与几何工具
 * ===================================================================*/
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: true, ...o });
const M = {};
for (const k in PAL0) M[k] = std(PAL0[k]);
M.dark = std('#101010');
M.glowKey = std('#fff4d0', { emissive: '#ffd27a', emissiveIntensity: 1.4 });
M.white = std('#f2f2f2');
M.flower = [std('#e0a0a8'), std('#f1d06a'), std('#c9a6e0'), std('#f3f0e6')];
const _c0 = {}, _c1 = {};
for (const k in PAL0) { _c0[k] = new THREE.Color(PAL0[k]); _c1[k] = new THREE.Color(PAL1[k]); }
function applyPalette(f) { for (const k in PAL0) M[k].color.copy(_c0[k]).lerp(_c1[k], f); }

const building = new THREE.Group(); scene.add(building);   // 1–4 楼共用的空间
const puzzleGroup = new THREE.Group(); building.add(puzzleGroup);
const roof = new THREE.Group(); scene.add(roof);           // 楼顶天台（4 楼上楼后出现）

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  if (parent) parent.add(m); return m;
}
function group(...kids) { const g = new THREE.Group(); kids.forEach(k => g.add(k)); return g; }
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// 锥形管（树根/树枝）
function taperedTube(points, r0, r1, mat, seg = 12, radial = 5) {
  const curve = new THREE.CatmullRomCurve3(points);
  const frames = curve.computeFrenetFrames(seg, false), pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, p = curve.getPointAt(t), r = r0 + (r1 - r0) * t, N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(p.x + r * (c * N.x + s * B.x), p.y + r * (c * N.y + s * B.y), p.z + r * (c * N.z + s * B.z));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial; idx.push(a, b, a + radial, b, b + radial, a + radial);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return new THREE.Mesh(g, mat);
}

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}
function textTexture(lines, { w = 512, h = 128, font = 56, color = '#2b2521', bg = null } = {}) {
  return canvasTex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.fillStyle = color; g.font = `${font}px "Songti SC","Noto Serif SC",serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((t, i) => g.fillText(t, w / 2, h / (lines.length + 1) * (i + 1)));
  });
}
// 被水泡过、看不清的字
function smudgeTexture(seed) {
  const rng = mulberry32(seed);
  return canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#d9d1bd'; g.fillRect(0, 0, w, h);
    g.filter = 'blur(3px)'; g.strokeStyle = 'rgba(60,50,44,.7)'; g.lineWidth = 7;
    for (let k = 0; k < 4; k++) { g.beginPath(); let x = 30 + k * 50; g.moveTo(x, 64);
      for (let i = 0; i < 6; i++) g.lineTo(x += 7, 64 + (rng() - 0.5) * 40); g.stroke(); }
    g.filter = 'none'; g.fillStyle = 'rgba(120,110,95,.25)'; g.beginPath(); g.arc(150, 70, 45, 0, 7); g.fill();
  });
}

/* =====================================================================
 * 5. 物理代理：不可见行走面 + AABB 碰撞
 *    ctx = { parent, T(局部→世界矩阵), collide }：同一段几何可以原样放在楼梯两端
 * ===================================================================*/
const walkables = [], colliders = [];
const proxyMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
const I4 = new THREE.Matrix4();
function collider(x0, x1, z0, z1, y0 = -1, y1 = 4) {
  const c = { minX: x0, maxX: x1, minZ: z0, maxZ: z1, minY: y0, maxY: y1, enabled: true }; colliders.push(c); return c;
}
function walkQuad(ctx, a, b, c, d) {
  const pts = [a, b, c, a, c, d].flatMap(p => V(...p).applyMatrix4(ctx.T).toArray());
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const m = new THREE.Mesh(g, proxyMat); m.visible = false; m.userData.owner = ctx.owner || building;
  scene.add(m); walkables.push(m); return m;
}
// 实体方块：视觉（ctx.parent 局部坐标）+ 碰撞（变换到世界坐标）
function solid(ctx, x0, x1, y0, y1, z0, z1, mat, collide = true) {
  const m = box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, ctx.parent);
  if (collide && ctx.collide) {
    const bb = new THREE.Box3(V(x0, y0, z0), V(x1, y1, z1)).applyMatrix4(ctx.T);
    m.userData.col = collider(bb.min.x, bb.max.x, bb.min.z, bb.max.z, bb.min.y, bb.max.y);
  }
  return m;
}

/* =====================================================================
 * 6. 关卡（单位：米）
 *   走廊 A：x 0→24，z 0→3；转角后走廊 B：x 21→24，z 0→-16；过渡房间 x 18.5→26.5，z -16→-22
 *   入口楼梯（局部坐标）：从 z=-10 的门（关着）起，沿 +z 升 3 米，从北墙开口进入走廊 A 起点
 *   出口楼梯 = 入口楼梯经 T 变换，从房间西门起沿 -x 升 3 米；顶端是 T 变换后的"下一层起点"复制品
 *   玩家爬到出口楼梯一半时，被移到入口楼梯的同一位置 —— 看到的东西完全一样，所以没有切换感
 * ===================================================================*/
const H = 3;
const T = new THREE.Matrix4().makeRotationY(-Math.PI / 2).setPosition(8.3, 3, -20.5);   // 入口楼梯 → 出口楼梯
const Tinv = T.clone().invert();
const ctxA = { parent: building, T: I4, collide: true };
const world = {
  lamps: [], stubLights: [], plants: [], roots: [], branches: [], notes: [], keyNotes: [], sign: null,
  entranceLeaf: null, farLeaf: null, sea: null, anchors: [], stub: null, portal: null,
};

// 8 个摆放点（与设计文档平面图一致）
const FACE = { N: 0, S: Math.PI, E: -Math.PI / 2, W: Math.PI / 2 };
const ANCHORS = [
  { id: 1, x: 5,     z: 0.45,  rot: FACE.N, furn: 'shoeCabinet' },
  { id: 2, x: 9,     z: 2.55,  rot: FACE.S, furn: 'sideTable' },
  { id: 3, x: 13,    z: 0.3,   rot: FACE.N, furn: 'shelf' },
  { id: 4, x: 18,    z: 2.55,  rot: FACE.S, furn: 'cabinet' },
  { id: 5, x: 23.45, z: 2.2,   rot: FACE.E, furn: 'boxes' },
  { id: 6, x: 21.45, z: -5,    rot: FACE.W, furn: 'phoneTable' },
  { id: 7, x: 23.6,  z: -8.5,  rot: FACE.E, furn: 'bench' },
  { id: 8, x: 21.45, z: -13,   rot: FACE.W, furn: 'lowCabinet' },
];

const bulbMats = [];
function lampVisual(parent, x, z, idx) {
  bulbMats[idx] = bulbMats[idx] || std('#fff', { emissive: '#ffffff', emissiveIntensity: 1 });
  const g = group(box(0.01, 0.6, 0.01, M.trim, 0, 0.3, 0),
    new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.18, 6, 1, true), std('#3a3a3a', { side: THREE.DoubleSide })));
  g.children[1].position.y = -0.05;
  const bulb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), bulbMats[idx]); bulb.position.y = -0.12; g.add(bulb);
  g.position.set(x, H - 0.6, z); parent.add(g);
}
function pointLight(parent, x, y, z) { const l = new THREE.PointLight('#fff', 3, 7, 1.4); l.position.set(x, y, z); parent.add(l); return l; }

// 楼梯（入口楼梯的局部坐标）：底端平台 z -10→-8（y=-3），梯段 z -8→0 升到 y=0，宽 x 0.3→2.7
function buildStairwell(ctx, withReplicaDoor) {
  for (let i = 0; i < 16; i++) {
    const top = -3 + (i + 1) * 3 / 16;
    solid(ctx, 0.3, 2.7, -3.1, top, -8 + i * 0.5, -8 + (i + 1) * 0.5, M.floor, false);
  }
  solid(ctx, 0.3, 2.7, -3.1, -3, -10, -8, M.floor, false);
  walkQuad(ctx, [0.3, -3, -8], [2.7, -3, -8], [2.7, 0, 0], [0.3, 0, 0]);
  walkQuad(ctx, [0.3, -3, -10], [2.7, -3, -10], [2.7, -3, -8], [0.3, -3, -8]);
  solid(ctx, 0.1, 0.3, -3.2, 3.2, -10.2, 0, M.wall); solid(ctx, 2.7, 2.9, -3.2, 3.2, -10.2, 0, M.wall);
  solid(ctx, 0.1, 2.9, 3, 3.2, -10.2, 0, M.ceil, false);
  if (withReplicaDoor) { // 与过渡房间西门一模一样的关着的门（门后没有房间）
    solid(ctx, 0.1, 0.9, -3.2, 3.2, -10.2, -10, M.wall); solid(ctx, 2.1, 2.9, -3.2, 3.2, -10.2, -10, M.wall);
    solid(ctx, 0.9, 2.1, -0.8, 3.2, -10.2, -10, M.wall, false);
    box(1.2, 2.2, 0.06, M.trim, 1.5, -1.9, -10.1, ctx.parent);
    ctx.collide && collider(0.9, 2.1, -10.2, -10, -3.2, 3.2);
  }
}
// 走廊 A 起点（x 0→5）：楼梯顶端从北墙开口进来能看到的全部内容
function buildStart(ctx, isStub) {
  solid(ctx, 0, 5, -0.1, 0, 0, 3, M.floor, false); solid(ctx, 0, 5, H, H + 0.2, 0, 3, M.ceil, false);
  solid(ctx, -0.2, 0, -0.2, H, 0, 3, M.wall);                                // 西端墙
  solid(ctx, -0.2, 0.3, -0.2, H, -0.2, 0, M.wall); solid(ctx, 2.7, 5, -0.2, H, -0.2, 0, M.wall); // 北墙（楼梯口）
  solid(ctx, -0.2, 5, -0.2, H, 3, 3.2, M.wall);                               // 南墙
  box(4.7, 0.1, 0.03, M.trim, 2.65, 0.05, 0.015, ctx.parent); box(5, 0.1, 0.03, M.trim, 2.5, 0.05, 2.985, ctx.parent);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24), world.signMat);
  sign.position.set(1.5, 1.6, 2.99); sign.rotation.y = Math.PI; ctx.parent.add(sign);
  lampVisual(ctx.parent, 3, 1.5, 0);
  if (isStub) { // 复制品：只做看得到的部分，远处封死；灯与真走廊的第一盏同步
    solid(ctx, 4.9, 5, 0, H, 0, 3, M.wall, false);
    world.stubLights.push(pointLight(ctx.parent, 3, H - 0.8, 1.5));
  } else {
    world.lamps.push({ light: pointLight(ctx.parent, 3, H - 0.8, 1.5), bulb: bulbMats[0] });
  }
}

function buildBuilding() {
  const B = building, c = ctxA;
  world.signMat = new THREE.MeshStandardMaterial({ roughness: 1 });
  // --- 入口楼梯 + 走廊起点
  buildStairwell(c, true);
  buildStart(c, false);

// 楼层里的"内容"：植物、树枝、海、号牌（在玩家看不到走廊时切换）
function applyContent(n) {
  if (n === 5) return;
  world.roots.forEach((r, i) => r.visible = i < [4, 8, 12, 16][n - 1]);
  world.plants.forEach((p, i) => p.visible = i < [0, 8, 22, 44][n - 1]);
  world.branches.forEach(b => b.visible = n >= 3);
  world.sea.visible = n >= 2 || state.roofMode;
  const s = world.signMat; s.map?.dispose(); s.map = textTexture([String(n)], { w: 64, h: 64, font: 40, color: '#b9b2a2', bg: '#3a352f' }); s.needsUpdate = true;
}
// 过渡房间墙上的字：母亲的便条 + 本层「钥匙」便条（拿到的清楚，没拿到的模糊）
function applyRoomNotes(n) {
  world.notes.forEach((m, i) => m.visible = i < n - 1);
  const ks = FLOORS[n]?.keys || [];
  world.keyNotes.forEach((m, i) => {
    m.visible = i < ks.length; if (!m.visible) return;
    m.material.map?.dispose();
    m.material.map = state.keysGot.has(ks[i]) ? textTexture([KEYS[ks[i]].note], { w: 256, h: 128, font: 40, bg: '#e6dfcc' }) : smudgeTexture(i * 31 + n);
    m.material.needsUpdate = true;
  });
}

const look = { f: 0, lamp: 3.8, hemi: 0.3, sun: 0.3, near: 5, far: 22, sky: new THREE.Color(PAL0.sky), lampColor: new THREE.Color('#c6ccd2') };
let lookTo = null;
function lookTarget(n) {
  const L = LOOK[n];
  return { f: L.f, lamp: L.lamp, hemi: L.hemi, sun: L.sun, near: L.fog[0], far: L.fog[1],
    sky: L.sky ? new THREE.Color(L.sky) : _c0.sky.clone().lerp(_c1.sky, L.f), lampColor: new THREE.Color(L.lampColor), flicker: !!L.flicker };
}
function setLook(n, instant) { lookTo = lookTarget(n); if (instant) updateLook(0, true); }
function updateLook(dt, instant) {
  const k = instant ? 1 : 1 - Math.exp(-dt / 2.2), t = lookTo;
  for (const key of ['f', 'lamp', 'hemi', 'sun', 'near', 'far']) look[key] += (t[key] - look[key]) * k;
  look.sky.lerp(t.sky, k); look.lampColor.lerp(t.lampColor, k);
  applyPalette(look.f);
  scene.background.copy(look.sky); scene.fog.color.copy(look.sky); scene.fog.near = look.near; scene.fog.far = look.far;
  hemi.intensity = state.lightsOn ? look.hemi : Math.min(look.hemi, 0.1); sun.intensity = look.sun;
  const flick = t.flicker && state.floor === 1;
  world.lamps.forEach((l, i) => {
    l.light.visible = state.lightsOn; l.light.color.copy(look.lampColor);
    l.light.intensity = look.lamp * (flick && Math.random() < 0.015 ? 0.35 : 1);
    l.bulb.emissiveIntensity = state.lightsOn ? 1 : 0;
  });
  // 复制品里的灯、替代房间灯的灯，和真灯保持一致
  world.stubLights.forEach((s, i) => { const l = world.lamps[i].light; s.visible = l.visible; s.color.copy(l.color); s.intensity = l.intensity; });
  const room = world.lamps[world.lamps.length - 1].light;
  world.replicaLight.visible = room.visible; world.replicaLight.color.copy(room.color); world.replicaLight.intensity = room.intensity;
}

    case 'machine': b(0.24, 0.07, 0.17, 0, 0.035, 0); b(0.02, 0.01, 0.02, 0.08, 0.075, 0.05, std('#f33', { emissive: '#f22', emissiveIntensity: 2 })); break;
    case 'housekey': { const r = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.007, 4, 8), mat); r.rotation.x = Math.PI / 2; r.position.set(-0.04, 0.008, 0); g.add(r); b(0.08, 0.01, 0.012, 0.02, 0.008, 0); break; }
    case 'can': { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.2, 8), mat); c.position.y = 0.1; g.add(c); const s = b(0.02, 0.02, 0.2, 0, 0.14, 0.12); s.rotation.x = -0.6; break; }
    case 'tool': b(0.16, 0.03, 0.03, 0, 0.015, 0, M.trim); b(0.03, 0.03, 0.08, 0.07, 0.015, 0.03, M.trim); break;
  }
  hitSphere(g, 0.28, 0.12);
  return g;
}
function takeKey(obj, id) {
  obj.visible = false; state.keysGot.add(id); state.solved++;
  say(KEYS[id].text, 3800); Platform.emit('pickup', { id, floor: state.floor });
}
const takeLabel = id => () => `E　拿起　${KEYS[id].name}`;
function wrongPick(obj) {
  obj.visible = false; state.wrong = true; Platform.emit('wrong', { floor: state.floor });
  let n = 0; state.blink = true;
  const t = setInterval(() => { state.lightsOn = n % 2 === 1 ? state.lightsOnSaved : false; if (++n > 5) { clearInterval(t); state.lightsOn = state.lightsOnSaved; state.blink = false; } }, 90);
  state.lightsOnSaved = state.lightsOn;
}
function placeAt(obj, res, dx) { obj.position.copy(anchorTop(res, dx)); obj.rotation.y = res.a.rot; puzzleGroup.add(obj); return obj; }

const TEMPLATES = {
  misplaced: { anchors: 1, build(id, [r]) {
    const o = placeAt(makeKey(id), r, 0.22); interactable(o, takeLabel(id), () => takeKey(o, id)); return { obj: o };
  } },
  twin: { anchors: 2, build(id, [r1, r2]) { // 待讨论：怎样让玩家分得清真假
    const real = placeAt(makeKey(id, std('#b9a27a')), r1, 0.2); real.rotation.y += Math.PI; real.scale.setScalar(1.06);
    const fake = placeAt(makeKey(id), r2, 0.2);
    interactable(real, takeLabel(id), () => takeKey(real, id));
    interactable(fake, takeLabel(id), () => wrongPick(fake));
    return { obj: real, fake };
  } },
  behind: { anchors: 0, build(id) {
    const o = makeKey(id); o.visible = false; puzzleGroup.add(o); let seen = false;
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, update() {
      if (seen || state.keysGot.has(id) || state.phase !== 'corridor' || !inCorridor(player.pos)) return;
      const s = pathS(player.pos); if (s < 6) return;
      if (o.visible && inView(o.position)) { seen = true; return; }
      const p = pathPoint(Math.max(4.5, s - 3.2)); if (inView(p)) return;
      o.position.copy(p); o.rotation.y = Math.random() * 6; o.visible = true;
    } };
  } },
  dark: { anchors: 1, build(id, [r]) {
    const o = placeAt(makeKey(id, M.glowKey), r, 0.22); o.visible = !state.lightsOn;
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, onLights(on) { if (!state.keysGot.has(id)) o.visible = !on; } };
  } },
  sound: { anchors: 1, needsCabinet: true, build(id, [r]) {
    const cab = r.cabinet, o = makeKey(id); o.visible = false;
    o.position.set(0.1, 0.25, 0); r.group.add(o);
    const body = r.group.children[0];
    interactable(body, () => cab.open ? '' : 'E　打开柜子', () => { cab.open = true; cab.leaf.rotation.y = -1.6; o.visible = true; stopSound(snd); });
    interactable(o, takeLabel(id), () => takeKey(o, id));
    const snd = startSound(anchorTop(r, 0));
    return { obj: o, cab: body, cleanup() { stopSound(snd); cab.open = false; cab.leaf.rotation.y = 0; r.group.remove(o); body.userData.interact = null; } };
  } },
  combo: { anchors: 2, build(id, [r1, r2]) {
    const tool = placeAt(makeKey('tool'), r1, 0.25); let hasTool = false;
    const chest = placeAt(group(box(0.44, 0.26, 0.3, M.furn, 0, 0.13, 0)), r2, 0.2);
    const lid = box(0.44, 0.04, 0.3, M.trim, 0, 0.28, 0, chest); hitSphere(chest, 0.3, 0.15);
    const o = makeKey(id); o.visible = false; o.position.set(0, 0.26, 0); chest.add(o);
    interactable(tool, () => 'E　拿起　把手', () => { tool.visible = false; hasTool = true; say('一只旧把手。', 2000); });
    interactable(chest, () => lid.userData.open ? '' : hasTool ? 'E　用把手打开箱子' : '箱子锁着', () => {
      if (!hasTool || lid.userData.open) return; lid.userData.open = true; lid.rotation.x = -1.2; lid.position.set(0, 0.36, -0.15); o.visible = true;
    });
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, tool, chest };
  } },
};

function inCorridor(p) { return (p.x > 0 && p.x < 24 && p.z > 0 && p.z < 3) || (p.x > 21 && p.x < 24 && p.z > -16 && p.z <= 0); }
function pathS(p) { return (p.z < 0.2 && p.x > 20.5) ? 22.5 + (1.5 - p.z) : Math.min(p.x, 22.5); }
function pathPoint(s) { return s <= 22.5 ? V(s, 0, 1.5 + (Math.random() - 0.5) * 1.2) : V(22.5 + (Math.random() - 0.5) * 1.2, 0, 1.5 - (s - 22.5)); }
const _frustum = new THREE.Frustum(), _m4 = new THREE.Matrix4();
function inView(p) {
  camera.updateMatrixWorld(); _m4.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_m4); return _frustum.containsPoint(V(p.x, p.y + 0.1, p.z)) && camera.position.distanceTo(p) < 12;
}

function clearPuzzles() { for (const p of state.puzzles) p.cleanup?.(); state.puzzles = []; puzzleTargets = []; puzzleGroup.clear(); }
function genPuzzles(n) {
  clearPuzzles();
  const F = FLOORS[n]; if (!F.keys) return;
  const free = shuffle(world.anchors.slice());
  const take = (k, cab) => {
    const out = [];
    for (let i = 0; i < free.length && out.length < k; i++) if (!cab || free[i].cabinet) out.push(free.splice(i--, 1)[0]);
    return out.length === k ? out : null;
  };
  for (const id of F.keys) {
    let tpl = state.forceTpl.shift() || pick(F.pool), Tp = TEMPLATES[tpl], rs = take(Tp.anchors, Tp.needsCabinet);
    if (!rs) { tpl = 'misplaced'; Tp = TEMPLATES.misplaced; rs = take(1); }
    state.puzzles.push({ id, tpl, anchors: rs.map(r => r.a.id), ...Tp.build(id, rs) });
    state.experienced++;
  }
  Platform.emit('puzzles', { floor: n, list: state.puzzles.map(p => p.tpl) });
}

/* =====================================================================
 * 9. 声音（循声谜题；Web Audio 定位声源）
 * ===================================================================*/
let audio = null; const sounds = new Set();
function initAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; } }
function startSound(pos) {
  const s = { timer: setInterval(() => {
    if (!audio || state.phase !== 'corridor') return;
    const pan = new PannerNode(audio, { panningModel: 'HRTF', distanceModel: 'inverse', refDistance: 1.5, rolloffFactor: 1.2, positionX: pos.x, positionY: pos.y, positionZ: pos.z });
    const osc = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(620, t + 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    osc.connect(g).connect(pan).connect(audio.destination); osc.start(t); osc.stop(t + 0.3);
  }, 1500) };
  sounds.add(s); return s;
}
function stopSound(s) { if (s) { clearInterval(s.timer); sounds.delete(s); } }
function updateListener() {
  if (!audio) return; const L = audio.listener, f = V(0, 0, -1).applyQuaternion(camera.quaternion);
  if (L.positionX) { L.positionX.value = camera.position.x; L.positionY.value = camera.position.y; L.positionZ.value = camera.position.z;
    L.forwardX.value = f.x; L.forwardY.value = f.y; L.forwardZ.value = f.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0; }
  else { L.setPosition(camera.position.x, camera.position.y, camera.position.z); L.setOrientation(f.x, f.y, f.z, 0, 1, 0); }
}

/* =====================================================================
 * 10. 过渡房间、楼梯、结局
 * ===================================================================*/
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
let sayToken = 0;
async function say(text, ms = 4000) {
  const t = ++sayToken, el = $('subtitle'); el.textContent = text; el.style.opacity = 1;
  await wait(ms); if (t === sayToken) el.style.opacity = 0; await wait(600);
}
function setDoor(leaf, open) { leaf.visible = !open; leaf.userData.col.enabled = !open; }

async function enterRoom() {
  state.phase = 'room';
  setDoor(world.entranceLeaf, false);                               // 身后的门关上
  applyRoomNotes(state.floor);                                      // 墙上便条反映这次拿到了哪些
  const F = FLOORS[state.floor], all = F.keys.every(k => state.keysGot.has(k));
  const line = all ? LINES.success[state.floor] : state.wrong ? pick(LINES.confused) : pick(LINES.hint[state.floor]);
  Platform.emit('room', { floor: state.floor, result: all ? 'success' : state.wrong ? 'confused' : 'hint' });
  // 走廊已经看不见了：换成下一段要走的状态（失败则同层重来，钥匙清空）
  state.next = all ? state.floor + 1 : state.floor;
  state.keysGot.clear(); state.wrong = false; setLights(true);
  state.roofMode = state.next === 5; world.stub.visible = !state.roofMode; roof.visible = state.roofMode;
  applyContent(state.next); genPuzzles(state.next);
  setLook(state.next);                                              // 光和颜色从现在开始慢慢变
  await wait(700); await say(line, 4200);
  setDoor(world.farLeaf, true); state.phase = 'stairs';             // 尽头的门打开
}

// 出口楼梯走到一半：移到入口楼梯的同一位置（两处看到的完全一样）
function stairWarp() {
  const p = player.pos; p.applyMatrix4(Tinv); player.yaw += Math.PI / 2;
  state.floor = state.next; state.phase = 'corridor';
  setDoor(world.entranceLeaf, true); setDoor(world.farLeaf, false);
  applyRoomNotes(state.floor);
  Platform.emit(state.floor === state.prevFloor ? 'repeat' : 'floor', { floor: state.floor });
  state.prevFloor = state.floor;
}

async function endGame() {
  if (state.ended) return; state.ended = true; state.busy = true;
  const secs = Math.round((performance.now() - state.t0) / 1000), mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  Platform.emit('end', { seconds: secs, puzzles: state.experienced, solved: state.solved });
  $('fade').style.opacity = 1; await wait(1800);
  $('stats').textContent = `用时 ${mm}:${ss}　·　体验过 ${state.experienced} 个谜题`;
  $('end').style.display = 'flex'; document.exitPointerLock?.();
}

/* =====================================================================
 * 11. 第一人称控制
 * ===================================================================*/
const player = { pos: new THREE.Vector3(), vy: 0, yaw: 0, pitch: 0, onGround: true };
function spawn() { player.pos.set(1.5, 0, 1.2); player.vy = 0; player.yaw = -Math.PI / 2; player.pitch = 0; } // 面朝 +x

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (DEBUG && /^Digit[1-5]$/.test(e.code)) debugJump(+e.code.slice(5));
  if (DEBUG && e.code === 'KeyK') debugCollectAll();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let playing = false, dragLook = false, dragging = false, started = false, ready = false;
const canvas = renderer.domElement;
function look2(dx, dy) { player.yaw -= dx * CFG.lookSens; player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * CFG.lookSens)); }
addEventListener('mousemove', e => { if (document.pointerLockElement === canvas || (dragLook && dragging)) look2(e.movementX, e.movementY); });
canvas.addEventListener('mousedown', e => { if (dragLook) dragging = true; if (playing && e.button === 0) tryInteract(); });
addEventListener('mouseup', () => { dragging = false; });
$('start').addEventListener('click', () => {
  if (!ready || state.ended) return;
  initAudio();
  try { const p = canvas.requestPointerLock(); if (p?.catch) p.catch(() => enableDragLook()); } catch { enableDragLook(); }
  startPlaying();
});
function startPlaying() {
  playing = true; $('start').style.display = 'none';
  if (!started) { started = true; state.t0 = performance.now(); Platform.emit('start', { floor: state.floor }); }
}
function enableDragLook() { dragLook = true; startPlaying(); }
document.addEventListener('pointerlockerror', enableDragLook);
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas && !dragLook && !state.ended) { playing = false; $('start').style.display = 'flex'; $('startText').textContent = '点击继续'; }
});

const DOWN = V(0, -1, 0), ray = new THREE.Raycaster();
function groundAt(x, y, z) {
  ray.set(V(x, y + CFG.stepHeight, z), DOWN); ray.far = 60;
  const hit = ray.intersectObjects(walkables.filter(w => w.userData.owner.visible), false)[0]; return hit ? hit.point.y : -Infinity;
}
function collide(p) {
  const r = CFG.radius, y0 = p.y + 0.2, y1 = p.y + 1.7;
  for (const c of colliders) {
    if (!c.enabled || y1 < c.minY || y0 > c.maxY) continue;
    const cx = Math.max(c.minX, Math.min(p.x, c.maxX)), cz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
    else { const o = [[c.minX - r - p.x, 0], [c.maxX + r - p.x, 0], [0, c.minZ - r - p.z], [0, c.maxZ + r - p.z]].sort((a, b) => Math.abs(a[0] + a[1]) - Math.abs(b[0] + b[1]))[0]; p.x += o[0]; p.z += o[1]; }
  }
}
let bob = 0;
function updatePlayer(dt) {
  const p = player.pos;
  if (playing && !state.ended) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (f || s) {
      const sp = (keys.ShiftLeft || keys.ShiftRight ? CFG.runSpeed : CFG.walkSpeed) * dt / Math.hypot(f, s);
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      p.x += (-sy * f + cy * s) * sp; p.z += (-cy * f - sy * s) * sp; collide(p); bob += dt * 7;
    }
  }
  const gy = groundAt(p.x, p.y, p.z);
  if (p.y <= gy || (player.onGround && p.y - gy < CFG.stepHeight)) { p.y = gy; player.vy = 0; player.onGround = true; }
  else { player.vy -= CFG.gravity * dt; p.y += player.vy * dt; player.onGround = false; if (p.y < gy) { p.y = gy; player.vy = 0; player.onGround = true; } }
  if (p.y < -40) spawn();
  camera.position.set(p.x, p.y + CFG.eyeHeight + Math.sin(bob) * 0.022, p.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  if (state.ended) return;
  const onExitStair = p.x < 18.3 && p.x > 8 && p.z > -20.2 && p.z < -17.8;
  if (state.phase === 'corridor' && p.z < -16.9 && p.x > 18.5) enterRoom();
  if (state.phase === 'stairs' && onExitStair) {
    if (world.farLeaf.userData.col.enabled === false && p.x < 17.6) setDoor(world.farLeaf, false);  // 身后的门关上
    if (!state.roofMode && world.farLeaf.visible && p.x < 12.7) stairWarp();
  }
  if (state.roofMode && state.phase === 'stairs' && p.y > 3.05 && p.x < 8.4) { state.floor = 5; state.phase = 'roof'; sun.position.set(30, 40, 20); Platform.emit('floor', { floor: 5 }); }
  if (state.phase === 'roof' && Math.abs(p.z - world.portal.position.z) < 0.45 && Math.abs(p.x - world.portal.position.x) < 1.0) endGame();
}

/* =====================================================================
 * 12. 交互
 * ===================================================================*/
const CENTER = new THREE.Vector2(0, 0);
let focused = null;
function shown(o) { for (; o; o = o.parent) if (!o.visible) return false; return true; }
function findFocus() {
  ray.setFromCamera(CENTER, camera); ray.far = CFG.reach;
  const targets = [...permTargets, ...puzzleTargets].filter(o => o.userData.interact && shown(o));
  let label = ''; focused = null;
  for (const h of ray.intersectObjects(targets, true)) { // 取第一个有可用交互的物体（开着的柜子后面还有钥匙）
    let o = h.object; while (o && !o.userData.interact) o = o.parent;
    if (!o || !shown(o)) continue;
    label = o.userData.interact.label(); if (label) { focused = o; break; }
  }
  const el = $('prompt'); if (label) el.textContent = label; el.style.opacity = label && playing ? 0.85 : 0;
}
function tryInteract() { if (!playing || !focused || state.busy) return; const f = focused; focused = null; f.userData.interact.act(); }

/* =====================================================================
 * 13. 调试（?debug）：1–5 跳楼层，K 拿齐本层钥匙
 * ===================================================================*/
function debugJump(n) {
  state.floor = state.next = state.prevFloor = n; state.keysGot.clear(); state.wrong = false; setLights(true);
  state.roofMode = n === 5; world.stub.visible = !state.roofMode; roof.visible = state.roofMode;
  setDoor(world.entranceLeaf, true); setDoor(world.farLeaf, false);
  applyContent(n); applyRoomNotes(n); genPuzzles(n); setLook(n, true);
  if (n === 5) { state.phase = 'roof'; sun.position.set(30, 40, 20); player.pos.set(6, 3.2, -19); player.yaw = Math.PI / 2; }
  else { state.phase = 'corridor'; sun.position.set(0, 50, 0); spawn(); }
}
function debugCollectAll() { (FLOORS[state.floor].keys || []).forEach(k => state.keysGot.add(k)); }

/* =====================================================================
 * 14. 主循环
 * ===================================================================*/
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePlayer(dt);
  for (const p of state.puzzles) p.update?.(dt);
  if (playing) findFocus();
  updateLook(dt);
  updateListener();
  renderer.render(scene, camera);
  if (DEBUG) {
    const p = player.pos;
    $('hud').textContent = `floor ${state.floor}→${state.next}  phase ${state.phase}  keys ${[...state.keysGot]}  wrong ${state.wrong}  lights ${state.lightsOn}\n` +
      `puzzles ${state.puzzles.map(q => `${q.id}:${q.tpl}@${q.anchors}`).join('  ')}\n` +
      `pos ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}  calls ${renderer.info.render.calls}  [1-5] 跳楼层 [K] 拿齐钥匙`;
  }
  requestAnimationFrame(tick);
}

(() => {
  buildBuilding(); buildRoof();
  state.prevFloor = 1;
  setDoor(world.entranceLeaf, true); setDoor(world.farLeaf, false);
  applyContent(1); applyRoomNotes(1); genPuzzles(1); setLook(1, true); spawn();
  if (DEBUG) {
    $('hud').style.display = 'block';
    window.__game = { player, state, world, camera, T, Tinv, debugJump, debugCollectAll, genPuzzles, forceTemplates: l => { state.forceTpl = l.slice(); } };
  }
  ready = true; $('startText').textContent = '点 击 进 入';
  Platform.emit('ready');
  tick();
})();
</script>
