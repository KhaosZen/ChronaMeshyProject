<script type="module">
import * as THREE from 'three';

const DEBUG = new URLSearchParams(location.search).has('debug');

/* =====================================================================
 * 1. 设计数据（对应设计文档）
 * ===================================================================*/
const CFG = {
  eyeHeight: 1.6, radius: 0.3, walkSpeed: 2.0, runSpeed: 3.2,
  gravity: 20, stepHeight: 0.45, lookSens: 0.0022, reach: 2.3,
};

// 每层要找的「钥匙」和可用的谜题模板（数门、顺序、窗外尚未实现）
const FLOORS = {
  1: { keys: ['photo'], pool: ['misplaced'] },
  2: { keys: ['cup', 'radio'], pool: ['misplaced', 'twin', 'behind', 'dark'] },
  3: { keys: ['poster', 'tickets', 'machine'], pool: ['twin', 'behind', 'dark', 'sound', 'combo'] },
  4: { keys: ['housekey', 'can'], pool: ['sound', 'combo'] },
  5: { rooftop: true },
};
const KEYS = {
  photo:    { name: '全家福',   text: '照片里缺了一张脸。' },
  cup:      { name: '倒扣的杯子', text: '杯子倒扣着。有人在等谁回家。' },
  radio:    { name: '收音机',   text: '「……水位仍在上涨，请居民尽快撤离……」' },
  poster:   { name: '寻人启事', text: '「寻人：离家时 16 岁……」名字被水泡糊了。' },
  tickets:  { name: '船票存根', text: '背面写着：「今天又去码头问了，还是没有你的消息。」' },
  machine:  { name: '答录机',   text: '「大家都搬走了。我不走，怕你回来找不到家。」' },
  housekey: { name: '家门钥匙', text: '钥匙一直挂在门边。' },
  can:      { name: '喷壶',     text: '「花盆里种了你小时候捡的那颗种子。等它长大，你就回来吧。」' },
};
const LINES = {
  success: {
    1: '照片上那张空着的脸……是我。我在这里长大。',
    2: '杯子扣着，是在等人回家。窗外……整座城都没了。',
    3: '我一直以为是我在找她。原来是她一直在找我。',
    4: '门从来没锁。花一直有人浇。……我该回家了。',
  },
  hint: {
    1: ['墙上的照片，好像少了点什么。', '这条走廊，刚才也是这样吗？'],
    2: ['有什么东西摆得不太对。', '是收音机的声音吗？'],
    3: ['码头……她是不是去过很多次？', '贴在墙上的纸，写的是谁？'],
    4: ['门边原来挂着什么来着？', '花，好像还是湿的。'],
  },
  confused: ['……不对，不是这个。', '我刚才碰了什么？', '好像越来越想不起来了。', '这里……我来过吗？', '头有点疼。'],
};
const WALL_NOTES = ['门 没锁', '花 浇了', '等你 回来']; // 2 楼起每层多一行

// 一楼灰色板 → 四楼彩色板，按楼层线性过渡
const PAL0 = { wall: '#5e5e5e', floor: '#3d3d3d', ceil: '#6a6a6a', trim: '#474747', furn: '#545454', key: '#8e8e8e',
  root: '#2c2c2c', plant: '#4a504a', sea: '#4d5357', sky: '#141414' };
const PAL1 = { wall: '#d6c7a6', floor: '#8a6a48', ceil: '#e4dac4', trim: '#9a7a56', furn: '#a27a54', key: '#e2b25e',
  root: '#5b4431', plant: '#6f9b4c', sea: '#3d8db0', sky: '#a9c8d4' };
const LOOK = { // 每层的光与雾
  1: { f: 0,    lamp: 2.8, lampColor: '#b8c2cc', sun: 0.1, hemi: 0.16, fog: [2, 16],  flicker: true },
  2: { f: 0.33, lamp: 3.6, lampColor: '#e8d2b0', sun: 0.5, hemi: 0.22, fog: [3, 26] },
  3: { f: 0.66, lamp: 3.0, lampColor: '#f0dcb8', sun: 1.1, hemi: 0.38, fog: [4, 38] },
  4: { f: 1,    lamp: 5.5, lampColor: '#ffe1ae', sun: 1.5, hemi: 0.55, fog: [6, 55] },
};

/* =====================================================================
 * 2. 平台适配层：所有与 Chrona 相关的调用集中在这里（待确认 API 后接入）
 * ===================================================================*/
const Platform = {
  emit(evt, detail = {}) {
    if (DEBUG) console.log('[platform]', evt, detail);
    window.dispatchEvent(new CustomEvent('root:' + evt, { detail }));
  },
};

/* =====================================================================
 * 3. 渲染基础
 * ===================================================================*/
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL0.sky);
scene.fog = new THREE.Fog(PAL0.sky, 2, 15);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 900);
camera.rotation.order = 'YXZ';
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const hemi = new THREE.HemisphereLight('#c8ccd0', '#2a2622', 0.12); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d8', 0.1); sun.position.set(20, 30, 40); scene.add(sun);

/* =====================================================================
 * 4. 材质与几何工具
 * ===================================================================*/
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: true, ...o });
const M = {};
for (const k in PAL0) M[k] = std(PAL0[k]);
M.dark = std('#101010');
M.glowKey = std('#fff4d0', { emissive: '#ffd27a', emissiveIntensity: 1.4 });
M.white = std('#f2f2f2');
M.flower = [std('#e0a0a8'), std('#f1d06a'), std('#c9a6e0'), std('#f3f0e6')];
const _c0 = {}, _c1 = {};
for (const k in PAL0) { _c0[k] = new THREE.Color(PAL0[k]); _c1[k] = new THREE.Color(PAL1[k]); }
function applyPalette(f) { for (const k in PAL0) M[k].color.copy(_c0[k]).lerp(_c1[k], f); }

const building = new THREE.Group(); scene.add(building);   // 1–4 楼共用的空间
const roof = new THREE.Group(); scene.add(roof);           // 天台
const puzzleGroup = new THREE.Group(); building.add(puzzleGroup);

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z);
  if (parent) parent.add(m); return m;
}
function group(...kids) { const g = new THREE.Group(); kids.forEach(k => g.add(k)); return g; }
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 锥形管（树根/树枝）
function taperedTube(points, r0, r1, mat, seg = 12, radial = 5) {
  const curve = new THREE.CatmullRomCurve3(points);
  const frames = curve.computeFrenetFrames(seg, false), pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, p = curve.getPointAt(t), r = r0 + (r1 - r0) * t, N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(p.x + r * (c * N.x + s * B.x), p.y + r * (c * N.y + s * B.y), p.z + r * (c * N.z + s * B.z));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial; idx.push(a, b, a + radial, b, b + radial, a + radial);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); return new THREE.Mesh(g, mat);
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function textTexture(lines, { w = 512, h = 128, font = 56, color = '#2b2521', bg = null } = {}) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = color; g.font = `${font}px "Songti SC","Noto Serif SC",serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((t, i) => g.fillText(t, w / 2, h / (lines.length + 1) * (i + 1)));
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; return tex;
}

/* =====================================================================
 * 5. 物理代理：不可见行走面 + AABB 碰撞
 * ===================================================================*/
const walkables = [], colliders = [];
const proxyMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
function walkQuad(a, b, c, d, parent = scene) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([...a, ...b, ...c, ...a, ...c, ...d], 3));
  const m = new THREE.Mesh(g, proxyMat); m.visible = false; parent.add(m); walkables.push(m); return m;
}
function collider(x0, x1, z0, z1, y0 = -1, y1 = 4) {
  const c = { minX: x0, maxX: x1, minZ: z0, maxZ: z1, minY: y0, maxY: y1, enabled: true }; colliders.push(c); return c;
}
// 实体方块：视觉 + 碰撞（y 范围同方块）
function solid(x0, x1, y0, y1, z0, z1, mat, parent = building, collide = true) {
  const m = box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, parent);
  if (collide) collider(x0, x1, z0, z1, y0, y1);
  return m;
}

/* =====================================================================
 * 6. 关卡（单位：米）
 *   走廊 A：x 0→24，z 0→3（玩家向 +x 走）；转角后走廊 B：x 21→24，z 0→-16（向 -z 走）
 *   过渡房间：x 18.5→26.5，z -16→-22；房间西墙的门通往出口楼梯（向 -x 上升 3 米）
 *   入口楼梯：x -8→0 从 y=-3 升到 0，接走廊 A 起点。出口楼梯走到一半时无缝传送到入口楼梯同一位置。
 * ===================================================================*/
const H = 3;
const EXIT = { x0: 18.5, run: 8, rise: 3, zc: -19 };   // 出口楼梯
const ENTRY = { x0: -8, y0: -3, zc: 1.5 };              // 入口楼梯（底端）
const ROOF_DZ = 100;                                     // 天台偏移
const world = {
  lamps: [], plants: [], roots: [], branches: [], notes: [], sign: null, switchObj: null,
  entranceLeaf: null, entranceCol: null, farLeaf: null, farCol: null, sea: null, anchors: [],
};

// 8 个摆放点（与设计文档平面图一致）：位置、朝向、家具
const FACE = { N: 0, S: Math.PI, E: -Math.PI / 2, W: Math.PI / 2 }; // 家具正面朝向：N 墙上的家具面朝 +z …
const ANCHORS = [
  { id: 1, x: 5,     z: 0.45,  rot: FACE.N, furn: 'shoeCabinet' },
  { id: 2, x: 9,     z: 2.55,  rot: FACE.S, furn: 'sideTable' },
  { id: 3, x: 13,    z: 0.3,   rot: FACE.N, furn: 'shelf' },
  { id: 4, x: 18,    z: 2.55,  rot: FACE.S, furn: 'cabinet' },
  { id: 5, x: 23.45, z: 2.2,   rot: FACE.E, furn: 'boxes' },
  { id: 6, x: 21.45, z: -5,    rot: FACE.W, furn: 'phoneTable' },
  { id: 7, x: 23.6,  z: -8.5,  rot: FACE.E, furn: 'bench' },
  { id: 8, x: 21.45, z: -13,   rot: FACE.W, furn: 'lowCabinet' },
];

function stairsVisual(x0, y0, dir, zc, width, parent) { // dir: +1 向 +x 上升，-1 向 -x 上升
  for (let i = 0; i < 16; i++) {
    const top = y0 + (i + 1) * 3 / 16, xa = x0 + dir * i * 0.5, xb = x0 + dir * (i + 1) * 0.5;
    box(0.5, top - (y0 - 0.1), width, M.floor, (xa + xb) / 2, (top + y0 - 0.1) / 2, zc, parent);
  }
}

function buildBuilding() {
  const B = building;
  // --- 地面与天花
  solid(0, 24, -0.1, 0, 0, 3, M.floor, B, false); solid(21, 24, -0.1, 0, -16.3, 0, M.floor, B, false);
  solid(18.3, 26.7, -0.1, 0, -22.2, -16.2, M.floor, B, false);
  solid(0, 24, H, H + 0.2, 0, 3, M.ceil, B, false); solid(21, 24, H, H + 0.2, -16.2, 0, M.ceil, B, false);
  solid(18.3, 26.7, H, H + 0.2, -22.2, -16.2, M.ceil, B, false);
  walkQuad([0, 0, 0], [24, 0, 0], [24, 0, 3], [0, 0, 3]);
  walkQuad([21, 0, -16.3], [24, 0, -16.3], [24, 0, 0], [21, 0, 0]);
  walkQuad([18.5, 0, -22], [26.5, 0, -22], [26.5, 0, -16.2], [18.5, 0, -16.2]);

  // --- 走廊墙（南墙和东墙开窗，碰撞按整面墙）
  solid(-0.2, 21, -0.2, H, -0.2, 0, M.wall);                       // A 北墙
  const winA = [[6, 7.5], [13, 14.5]], winB = [[-12.5, -11], [-6.5, -5]];
  let xs = 0; for (const [a, b] of [...winA, [24.2, 24.2]]) {
    solid(xs, a, 0, H, 3, 3.2, M.wall, B, false);
    if (a < 24) { solid(a, b, 0, 0.9, 3, 3.2, M.wall, B, false); solid(a, b, 2.1, H, 3, 3.2, M.wall, B, false); }
    xs = b;
  }
  collider(-0.2, 24.2, 3, 3.2);                                       // A 南墙
  let zs = -16; for (const [a, b] of [...winB, [3.2, 3.2]]) {
    solid(24, 24.2, 0, H, zs, a, M.wall, B, false);
    if (a < 3) { solid(24, 24.2, 0, 0.9, a, b, M.wall, B, false); solid(24, 24.2, 2.1, H, a, b, M.wall, B, false); }
    zs = b;
  }
  collider(24, 24.2, -16, 3.2);                                       // B 东墙
  solid(20.8, 21, -0.2, H, -16, 0, M.wall);                           // B 西墙
  // 踢脚线
  box(21, 0.1, 0.03, M.trim, 10.5, 0.05, 0.015, B); box(24, 0.1, 0.03, M.trim, 12, 0.05, 2.985, B);

  // --- 入口楼梯（x -8→0，y -3→0），两侧墙、底端墙、天花
  stairsVisual(ENTRY.x0, ENTRY.y0, +1, ENTRY.zc, 2.4, B);
  solid(-10, -8, ENTRY.y0 - 0.1, ENTRY.y0, 0.3, 2.7, M.floor, B, false);
  walkQuad([-8, -3, 0.3], [0, 0, 0.3], [0, 0, 2.7], [-8, -3, 2.7]);
  walkQuad([-10, -3, 0.3], [-8, -3, 0.3], [-8, -3, 2.7], [-10, -3, 2.7]);
  solid(-10, 0, -3.2, H, 0.1, 0.3, M.wall); solid(-10, 0, -3.2, H, 2.7, 2.9, M.wall);
  solid(-10.2, -10, -3.2, H, 0.1, 2.9, M.wall);
  solid(-10, 0, H, H + 0.2, 0.1, 2.9, M.ceil, B, false);
  solid(-0.2, 0, -0.2, H, -0.2, 0.3, M.wall); solid(-0.2, 0, -0.2, H, 2.7, 3.2, M.wall);

  // --- 过渡房间：南墙入口门、西墙出口门
  solid(18.3, 21.9, 0, H, -16.2, -16, M.wall); solid(23.1, 26.7, 0, H, -16.2, -16, M.wall);
  solid(21.9, 23.1, 2.2, H, -16.2, -16, M.wall, B, false);
  solid(18.3, 26.7, 0, H, -22.2, -22, M.wall); solid(26.5, 26.7, 0, H, -22.2, -16, M.wall);
  solid(18.3, 18.5, 0, H, -22.2, -19.6, M.wall); solid(18.3, 18.5, 0, H, -18.4, -16, M.wall);
  solid(18.3, 18.5, 2.2, H, -19.6, -18.4, M.wall, B, false);
  world.entranceLeaf = box(1.2, 2.2, 0.06, M.trim, 22.5, 1.1, -16.1, B);
  world.entranceCol = collider(21.9, 23.1, -16.25, -15.95, 0, H);
  world.farLeaf = box(0.06, 2.2, 1.2, M.trim, 18.4, 1.1, -19, B);
  world.farCol = collider(18.25, 18.55, -19.6, -18.4, 0, H);
  // 房间家具与墙上便条
  box(1.4, 0.75, 0.8, M.furn, 24.6, 0.375, -20.4, B); collider(23.9, 25.3, -20.8, -20, 0, 0.8);
  box(0.45, 0.45, 0.45, M.furn, 24.6, 0.225, -19.5, B);
  WALL_NOTES.forEach((t, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.25),
      new THREE.MeshStandardMaterial({ map: textTexture([t], { w: 512, h: 128, font: 60 }), transparent: true, roughness: 1 }));
    m.position.set(21.4, 2.1 - i * 0.34, -21.98); B.add(m); world.notes.push(m);
  });

  // --- 出口楼梯（x 18.5→10.5，y 0→3），很暗
  stairsVisual(EXIT.x0, 0, -1, EXIT.zc, 2.4, B);
  solid(8.5, 10.5, 2.9, 3, -20.2, -17.8, M.floor, B, false);
  walkQuad([18.5, 0, -20.2], [10.5, 3, -20.2], [10.5, 3, -17.8], [18.5, 0, -17.8]);
  walkQuad([8.5, 3, -20.2], [10.5, 3, -20.2], [10.5, 3, -17.8], [8.5, 3, -17.8]);

// 摆放点家具：返回 { a, group, top(表面高度), cabinet(可开门的柜子) }
function buildFurniture(a) {
  const g = new THREE.Group(); g.position.set(a.x, 0, a.z); g.rotation.y = a.rot; building.add(g);
  const res = { a, group: g, top: 0.9, cabinet: null };
  const deco = (w, h, d, x, y, z, mat = M.trim) => box(w, h, d, mat, x, y, z, g);
  const cab = (w, h, d) => { // 带门柜子，门在正面（+z）
    deco(w, h, d, 0, h / 2, 0, M.furn);
    const leaf = new THREE.Group(); leaf.position.set(-w / 2 + 0.02, 0, d / 2 + 0.015); g.add(leaf);
    box(w - 0.04, h - 0.1, 0.03, M.trim, (w - 0.04) / 2, h / 2, 0, leaf);
    res.cabinet = { leaf, open: false, w, h, d }; res.top = h;
  };
  switch (a.furn) {
    case 'shoeCabinet': cab(1.0, 0.9, 0.4); deco(0.12, 0.05, 0.28, -0.2, 0.025, 0.45); deco(0.12, 0.05, 0.28, -0.05, 0.025, 0.45); break;
    case 'sideTable': deco(0.6, 0.7, 0.4, 0, 0.35, 0, M.furn); deco(0.08, 0.25, 0.08, -0.15, 0.825, 0); deco(0.2, 0.12, 0.2, -0.15, 1.0, 0, M.white); res.top = 0.7; break;
    case 'shelf': deco(1.1, 0.04, 0.3, 0, 1.3, 0, M.furn); for (let i = 0; i < 5; i++) deco(0.06, 0.24, 0.2, -0.45 + i * 0.07, 1.44, 0, i % 2 ? M.trim : M.furn); res.top = 1.32; break;
    case 'cabinet': cab(0.8, 0.9, 0.45); break;
    case 'boxes': deco(0.6, 0.45, 0.5, 0, 0.225, 0, M.furn); deco(0.5, 0.35, 0.45, 0.02, 0.625, 0, M.furn); res.top = 0.8; break;
    case 'phoneTable': deco(0.5, 0.75, 0.4, 0, 0.375, 0, M.furn); deco(0.2, 0.08, 0.15, -0.12, 0.79, 0, M.trim); res.top = 0.75; break;
    case 'bench': deco(1.2, 0.45, 0.35, 0, 0.225, 0, M.furn); res.top = 0.45; break;

}

// 逐层增多的绿植：树根、植物团、树枝穿窗
function buildGreenery() {
  const rng = mulberry32(7);
  for (let i = 0; i < 16; i++) { // 树根沿墙脚蔓延
    const inB = i >= 10, s = rng();
    const base = inB ? V(rng() < 0.5 ? 21.2 : 23.8, 0, -1 - s * 14) : V(1 + s * 20, 0, rng() < 0.5 ? 0.2 : 2.8);
    const pts = []; let p = base.clone();
    for (let k = 0; k < 6; k++) { pts.push(V(p.x, 0.04 + Math.sin(k) * 0.03, p.z)); p = p.clone().add(inB ? V((rng() - 0.5) * 0.4, 0, -0.5) : V(0.5, 0, (rng() - 0.5) * 0.4)); }
    const m = taperedTube(pts, 0.05 + rng() * 0.04, 0.01, M.root, 14, 5); building.add(m); world.roots.push(m);
  }
  for (let i = 0; i < 44; i++) { // 植物团（4 楼有花）
    const inB = i % 3 === 2, s = rng();
    const pos = inB ? V(rng() < 0.5 ? 21.25 : 23.75, 0, -0.5 - s * 15) : V(0.8 + s * 22, 0, rng() < 0.5 ? 0.25 : 2.75);
    const up = rng() < 0.25; // 一部分长在墙上
    const g = new THREE.Group(); g.position.copy(pos); if (up) g.position.y = 0.8 + rng() * 1.6;
    for (let k = 0; k < 3; k++) {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12 + rng() * 0.16, 0), M.plant);
      m.position.set((rng() - 0.5) * 0.3, 0.1 + rng() * 0.2, (rng() - 0.5) * 0.3); g.add(m);
    }
    if (i > 28) { const f = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), M.flower[i % 4]); f.position.set(0, 0.36, 0); g.add(f); }
    building.add(g); world.plants.push(g);
  }
  // 树枝从窗外伸进来（3 楼起）
  for (const [x, z, dir] of [[6.75, 3.1, 'S'], [13.75, 3.1, 'S'], [24.1, -5.75, 'E'], [24.1, -11.75, 'E']]) {
    const out = dir === 'S' ? V(x + 1, 2.6, z + 4) : V(x + 4, 2.6, z - 1), mid = dir === 'S' ? V(x, 1.6, z + 0.2) : V(x + 0.2, 1.6, z);
    const tip = dir === 'S' ? V(x - 0.4, 1.9, z - 1.4) : V(x - 1.4, 1.9, z + 0.3);
    const g = new THREE.Group(); g.add(taperedTube([out, mid, tip], 0.09, 0.02, M.root, 10, 5));
    for (let k = 0; k < 3; k++) { const l = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 0), M.plant); l.position.copy(tip).add(V((k - 1) * 0.25, -0.1 * k, 0.1 * k)); g.add(l); }
    building.add(g); world.branches.push(g);
  }
}

  const cloudMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });

}

const state = {

function applyFloor(n) {
  const onRoof = n === 5;
  building.visible = !onRoof; roof.visible = onRoof;
  if (onRoof) {
    applyPalette(1);
    scene.background.set('#9fd0ea'); scene.fog.color.set('#c4e2ee'); scene.fog.near = 80; scene.fog.far = 700;
    hemi.intensity = 1.0; sun.intensity = 2.2; updateInv(); return;
  }
  const L = LOOK[n];
  applyPalette(L.f);
  scene.background.copy(M.sky.color); scene.fog.color.copy(M.sky.color);
  [scene.fog.near, scene.fog.far] = L.fog;
  sun.intensity = L.sun; setLights(true);
  world.roots.forEach((r, i) => r.visible = i < [4, 8, 12, 16][n - 1]);
  world.plants.forEach((p, i) => p.visible = i < [0, 8, 22, 44][n - 1]);
  world.branches.forEach(b => b.visible = n >= 3);
  world.sea.visible = n >= 2;
  world.notes.forEach((m, i) => m.visible = i < n - 1);
  const s = world.sign.material; s.map?.dispose(); s.map = textTexture([String(n)], { w: 64, h: 64, font: 40, color: '#b9b2a2', bg: '#3a352f' }); s.needsUpdate = true;
  updateInv();
}
function setLights(on) {
  state.lightsOn = on;
  const L = LOOK[state.floor] || LOOK[4];
  for (const l of world.lamps) { l.light.visible = on; l.light.color.set(L.lampColor); l.light.intensity = L.lamp; l.bulb.material.emissiveIntensity = on ? 1 : 0; }
  hemi.intensity = on ? L.hemi : Math.min(L.hemi, 0.08);
  for (const p of state.puzzles) p.onLights?.(on);
}

function hitSphere(obj, r = 0.25, y = 0.1) { const h = new THREE.Mesh(new THREE.SphereGeometry(r, 6, 4), proxyMat); h.visible = false; h.position.y = y; obj.add(h); }

// 灰盒「钥匙」外形（之后换成 Meshy 模型）
function makeKey(id, mat = M.key) {
  const g = new THREE.Group(), b = (w, h, d, x = 0, y = 0, z = 0, m = mat) => box(w, h, d, m, x, y, z, g);
  switch (id) {
    case 'photo': { const f = b(0.34, 0.44, 0.03, 0, 0.22, 0); f.rotation.x = -0.18; const p = b(0.26, 0.34, 0.01, 0, 0.22, 0.02, M.dark); p.rotation.x = -0.18; break; }
    case 'cup': { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.11, 8), mat); c.position.y = 0.055; g.add(c); b(0.015, 0.06, 0.03, 0.06, 0.055, 0); break; }
    case 'radio': b(0.3, 0.18, 0.1, 0, 0.09, 0); b(0.01, 0.25, 0.01, 0.1, 0.3, 0); b(0.08, 0.08, 0.01, -0.07, 0.1, 0.055, M.dark); break;
    case 'poster': b(0.34, 0.02, 0.46, 0, 0.01, 0, M.white); b(0.12, 0.022, 0.14, 0, 0.012, -0.08, M.dark); break;
    case 'tickets': for (let i = 0; i < 4; i++) { const t = b(0.14, 0.012, 0.07, 0.01 * i, 0.006 + i * 0.012, 0); t.rotation.y = i * 0.2; } break;
    case 'machine': b(0.24, 0.07, 0.17, 0, 0.035, 0); { const led = b(0.02, 0.01, 0.02, 0.08, 0.075, 0.05, std('#f33', { emissive: '#f22', emissiveIntensity: 2 })); } break;
    case 'housekey': { const r = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.007, 4, 8), mat); r.rotation.x = Math.PI / 2; r.position.set(-0.04, 0.008, 0); g.add(r); b(0.08, 0.01, 0.012, 0.02, 0.008, 0); break; }
    case 'can': { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.2, 8), mat); c.position.y = 0.1; g.add(c); const s = b(0.02, 0.02, 0.2, 0, 0.14, 0.12); s.rotation.x = -0.6; break; }
    case 'tool': b(0.16, 0.03, 0.03, 0, 0.015, 0, M.trim); b(0.03, 0.03, 0.08, 0.07, 0.015, 0.03, M.trim); break;
  }

}
function takeKey(obj, id) {
  obj.visible = false; state.keysGot.add(id); state.solved++;
  say(KEYS[id].text, 3800); Platform.emit('pickup', { id, floor: state.floor });
  updateInv();
}
function takeLabel(id) { return () => `E　拿起　${KEYS[id].name}`; }
function wrongPick(obj) {
  obj.visible = false; state.wrong = true; Platform.emit('wrong', { floor: state.floor });
  // 灯闪一下
  let n = 0; const t = setInterval(() => { world.lamps.forEach(l => l.light.visible = state.lightsOn && n % 2 === 1); if (++n > 5) { clearInterval(t); setLights(state.lightsOn); } }, 90);
}
function placeAt(obj, res, dx) { obj.position.copy(anchorTop(res, dx)); obj.rotation.y = res.a.rot; puzzleGroup.add(obj); return obj; }

const TEMPLATES = {
  // 错位：出现在够得到、看起来自然但不合常理的地方
  misplaced: { anchors: 1, build(id, [r]) {
    const o = placeAt(makeKey(id), r, 0.22); interactable(o, takeLabel(id), () => takeKey(o, id)); return { obj: o };
  } },
  // 真假：两份，只有反着放、颜色略不同的那份是真的；拿错会迷茫
  twin: { anchors: 2, build(id, [r1, r2]) {
    const real = placeAt(makeKey(id, std('#b9a27a')), r1, 0.2); real.rotation.y += Math.PI; real.scale.setScalar(1.06);
    const fake = placeAt(makeKey(id), r2, 0.2);
    interactable(real, takeLabel(id), () => takeKey(real, id));
    interactable(fake, takeLabel(id), () => wrongPick(fake));
    return { obj: real, fake };
  } },
  // 回头：只在玩家背对它时跟在身后，看到它之后才停下
  behind: { anchors: 0, build(id) {
    const o = makeKey(id); o.visible = false; puzzleGroup.add(o); let seen = false;
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, update() {
      if (seen || state.keysGot.has(id)) return;
      const s = pathS(player.pos); if (s < 6 || s > 38) return;
      if (o.visible && inView(o.position)) { seen = true; return; }
      const p = pathPoint(Math.max(1, s - 3.2)); if (inView(p)) return;
      o.position.copy(p); o.rotation.y = Math.random() * 6; o.visible = true;
    } };
  } },
  // 关灯：灯亮时看不见，关灯后发光
  dark: { anchors: 1, build(id, [r]) {
    const o = placeAt(makeKey(id, M.glowKey), r, 0.22); o.visible = !state.lightsOn;
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, onLights(on) { if (!state.keysGot.has(id)) o.visible = !on; } };
  } },
  // 循声：藏在关着的柜子里，柜子发出声音
  sound: { anchors: 1, needsCabinet: true, build(id, [r]) {
    const cab = r.cabinet, o = makeKey(id); o.visible = false;
    o.position.set(0.1, 0.25, 0); r.group.add(o);
    const body = r.group.children[0];
    interactable(body, () => cab.open ? '' : 'E　打开柜子', () => { cab.open = true; cab.leaf.rotation.y = -1.6; o.visible = true; stopSound(); });
    interactable(o, takeLabel(id), () => takeKey(o, id));
    const snd = startSound(anchorTop(r, 0));
    return { obj: o, cab: body, cleanup() { stopSound(snd); cab.open = false; cab.leaf.rotation.y = 0; r.group.remove(o); body.userData.interact = null; } };
  } },
  // 组合：一处放着把手，另一处是锁着的小箱子，「钥匙」在箱子里
  combo: { anchors: 2, build(id, [r1, r2]) {
    const tool = placeAt(makeKey('tool'), r1, 0.25); let hasTool = false;
    const chest = placeAt(group(box(0.44, 0.26, 0.3, M.furn, 0, 0.13, 0)), r2, 0.2);
    const lid = box(0.44, 0.04, 0.3, M.trim, 0, 0.28, 0, chest); hitSphere(chest, 0.3, 0.15);
    const o = makeKey(id); o.visible = false; o.position.set(0, 0.26, 0); chest.add(o);
    interactable(tool, () => 'E　拿起　把手', () => { tool.visible = false; hasTool = true; say('一只旧把手。', 2000); });
    interactable(chest, () => lid.userData.open ? '' : hasTool ? 'E　用把手打开箱子' : '箱子锁着', () => {
      if (!hasTool || lid.userData.open) return; lid.userData.open = true; lid.rotation.x = -1.2; lid.position.set(0, 0.36, -0.15); o.visible = true;
    });
    interactable(o, takeLabel(id), () => takeKey(o, id));
    return { obj: o, tool, chest };
  } },
};

// 走廊中心线参数化（用于「回头」模板）
function pathS(p) { return (p.z < 0.2 && p.x > 20.5) ? 22.5 + (1.5 - p.z) : Math.min(p.x, 22.5); }
function pathPoint(s) { return s <= 22.5 ? V(s, 0, 1.5 + (Math.random() - 0.5) * 1.2) : V(22.5 + (Math.random() - 0.5) * 1.2, 0, 1.5 - (s - 22.5)); }
const _frustum = new THREE.Frustum(), _m4 = new THREE.Matrix4();
function inView(p) {
  camera.updateMatrixWorld(); _m4.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_m4); return _frustum.containsPoint(V(p.x, p.y + 0.1, p.z)) && camera.position.distanceTo(p) < 12;
}

function clearPuzzles() {
  for (const p of state.puzzles) p.cleanup?.();
  state.puzzles = []; puzzleTargets = []; puzzleGroup.clear();
}
function genPuzzles() {
  clearPuzzles();
  const F = FLOORS[state.floor]; if (!F.keys) return;
  const free = shuffle(world.anchors.slice());
  const take = (n, cab) => {
    const out = [];
    for (let i = 0; i < free.length && out.length < n; i++) if (!cab || free[i].cabinet) out.push(free.splice(i--, 1)[0]);
    return out.length === n ? out : null;
  };
  for (const id of F.keys.filter(k => !state.keysGot.has(k))) {
    let tpl = state.forceTpl.shift() || pick(F.pool), T = TEMPLATES[tpl], rs = take(T.anchors, T.needsCabinet);
    if (!rs) { tpl = 'misplaced'; T = TEMPLATES.misplaced; rs = take(1); }
    const inst = T.build(id, rs); state.puzzles.push({ id, tpl, anchors: rs.map(r => r.a.id), ...inst });
    state.experienced++;
  }
  Platform.emit('puzzles', { floor: state.floor, list: state.puzzles.map(p => p.tpl) });
}

/* =====================================================================
 * 9. 声音（循声谜题；Web Audio 定位声源）
 * ===================================================================*/
let audio = null; const sounds = new Set();
function initAudio() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch { audio = null; } }
function startSound(pos) {
  const s = { pos, timer: null };
  s.timer = setInterval(() => {
    if (!audio || !building.visible) return;
    const pan = new PannerNode(audio, { panningModel: 'HRTF', distanceModel: 'inverse', refDistance: 1.5, rolloffFactor: 1.2, positionX: pos.x, positionY: pos.y, positionZ: pos.z });
    const osc = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(620, t + 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    osc.connect(g).connect(pan).connect(audio.destination); osc.start(t); osc.stop(t + 0.3);
  }, 1500);
  sounds.add(s); return s;
}
function stopSound(s) { const list = s ? [s] : [...sounds]; for (const x of list) { clearInterval(x.timer); sounds.delete(x); } }
function updateListener() {
  if (!audio) return; const L = audio.listener, f = V(0, 0, -1).applyQuaternion(camera.quaternion);
  if (L.positionX) { L.positionX.value = camera.position.x; L.positionY.value = camera.position.y; L.positionZ.value = camera.position.z;
    L.forwardX.value = f.x; L.forwardY.value = f.y; L.forwardZ.value = f.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0; }
  else { L.setPosition(camera.position.x, camera.position.y, camera.position.z); L.setOrientation(f.x, f.y, f.z, 0, 1, 0); }
}

/* =====================================================================
 * 10. 过渡房间、楼梯传送、结局
 * ===================================================================*/
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
let sayToken = 0;
async function say(text, ms = 4000) {
  const t = ++sayToken, el = $('subtitle'); el.textContent = text; el.style.opacity = 1;
  await wait(ms); if (t === sayToken) el.style.opacity = 0; await wait(600);
}
function setDoor(leaf, col, open) { leaf.visible = !open; col.enabled = !open; }

async function enterRoom() {
  state.roomDone = true;
  setDoor(world.entranceLeaf, world.entranceCol, false);          // 身后的门关上
  const F = FLOORS[state.floor], all = F.keys.every(k => state.keysGot.has(k));
  state.pendingNext = all;
  const line = all ? LINES.success[state.floor] : state.wrong ? pick(LINES.confused) : pick(LINES.hint[state.floor]);
  Platform.emit('room', { floor: state.floor, result: all ? 'success' : state.wrong ? 'confused' : 'hint' });
  await wait(700); await say(line, 4200);
  setDoor(world.farLeaf, world.farCol, true);                     // 尽头的门打开
}

// 出口楼梯走到一半 → 黑一下 → 入口楼梯（或天台楼梯）的同一位置
async function stairWarp() {
  state.busy = true;
  const fade = $('fade'); fade.classList.remove('slow', 'white'); fade.style.opacity = 1; await wait(320);
  const p = player.pos, t = (EXIT.x0 - p.x) / EXIT.run, lateral = -(p.z - EXIT.zc);
  if (state.pendingNext) { state.floor++; state.repeat = 0; state.keysGot.clear(); Platform.emit('floor', { floor: state.floor }); }
  else { state.repeat++; Platform.emit('repeat', { floor: state.floor, repeat: state.repeat }); }
  state.wrong = false; state.roomDone = false; state.pendingNext = false;
  setDoor(world.entranceLeaf, world.entranceCol, true); setDoor(world.farLeaf, world.farCol, false);
  applyFloor(state.floor); genPuzzles();
  const dz = state.floor === 5 ? ROOF_DZ : 0;
  p.set(ENTRY.x0 + EXIT.run * t, ENTRY.y0 + EXIT.rise * t, ENTRY.zc + lateral + dz);
  player.yaw += Math.PI; player.vy = 0;
  await wait(80); fade.style.opacity = 0; state.busy = false;
}

async function endGame() {
  if (state.ended) return; state.ended = true; state.busy = true;
  const secs = Math.round((performance.now() - state.t0) / 1000), mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  Platform.emit('end', { seconds: secs, puzzles: state.experienced, solved: state.solved });
  const fade = $('fade'); fade.classList.add('slow', 'white'); fade.style.opacity = 1; await wait(1800);
  $('stats').textContent = `用时 ${mm}:${ss}　·　体验过 ${state.experienced} 个谜题`;
  $('end').style.display = 'flex'; document.exitPointerLock?.();
}

/* =====================================================================
 * 11. 第一人称控制
 * ===================================================================*/
const player = { pos: new THREE.Vector3(), vy: 0, yaw: 0, pitch: 0, onGround: true };
function spawn() { player.pos.set(0.8, 0, 1.5); player.vy = 0; player.yaw = -Math.PI / 2; player.pitch = 0; } // 面朝 +x

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (DEBUG && /^Digit[1-5]$/.test(e.code)) debugJump(+e.code.slice(5));
  if (DEBUG && e.code === 'KeyK') debugCollectAll();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let playing = false, dragLook = false, dragging = false, started = false, ready = false;
const canvas = renderer.domElement;
function look(dx, dy) { player.yaw -= dx * CFG.lookSens; player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - dy * CFG.lookSens)); }
addEventListener('mousemove', e => { if (document.pointerLockElement === canvas || (dragLook && dragging)) look(e.movementX, e.movementY); });
canvas.addEventListener('mousedown', e => { if (dragLook) dragging = true; if (playing && e.button === 0) tryInteract(); });
addEventListener('mouseup', () => { dragging = false; });
$('start').addEventListener('click', () => {
  if (!ready || state.ended) return;
  initAudio();
  try { const p = canvas.requestPointerLock(); if (p?.catch) p.catch(() => enableDragLook()); } catch { enableDragLook(); }
  startPlaying();
});
function startPlaying() {
  playing = true; $('start').style.display = 'none';
  if (!started) { started = true; state.t0 = performance.now(); Platform.emit('start', { floor: state.floor }); }
}
function enableDragLook() { dragLook = true; startPlaying(); } // iframe 不允许 pointer lock 时，按住拖拽转视角
document.addEventListener('pointerlockerror', enableDragLook);
document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement !== canvas && !dragLook && !state.ended) { playing = false; $('start').style.display = 'flex'; $('startText').textContent = '点击继续'; }
});

const DOWN = V(0, -1, 0), ray = new THREE.Raycaster();
function groundAt(x, y, z) {
  ray.set(V(x, y + CFG.stepHeight, z), DOWN); ray.far = 60;
  const hit = ray.intersectObjects(walkables.filter(w => w.parent.visible), false)[0]; return hit ? hit.point.y : -Infinity;
}
function collide(p) {
  const r = CFG.radius, y0 = p.y + 0.2, y1 = p.y + 1.7;
  for (const c of colliders) {
    if (!c.enabled || y1 < c.minY || y0 > c.maxY) continue;
    const cx = Math.max(c.minX, Math.min(p.x, c.maxX)), cz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2), k = (r - d) / d; p.x += dx * k; p.z += dz * k; }
    else { const o = [[c.minX - r - p.x, 0], [c.maxX + r - p.x, 0], [0, c.minZ - r - p.z], [0, c.maxZ + r - p.z]].sort((a, b) => Math.abs(a[0] + a[1]) - Math.abs(b[0] + b[1]))[0]; p.x += o[0]; p.z += o[1]; }
  }
}
let bob = 0;
function updatePlayer(dt) {
  const p = player.pos;
  if (playing && !state.ended) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (f || s) {
      const sp = (keys.ShiftLeft || keys.ShiftRight ? CFG.runSpeed : CFG.walkSpeed) * dt / Math.hypot(f, s);
      const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
      p.x += (-sy * f + cy * s) * sp; p.z += (-cy * f - sy * s) * sp; collide(p); bob += dt * 7;
    }
  }
  const gy = groundAt(p.x, p.y, p.z);
  if (p.y <= gy || (player.onGround && p.y - gy < CFG.stepHeight)) { p.y = gy; player.vy = 0; player.onGround = true; }
  else { player.vy -= CFG.gravity * dt; p.y += player.vy * dt; player.onGround = false; if (p.y < gy) { p.y = gy; player.vy = 0; player.onGround = true; } }
  if (p.y < -40) spawn();
  camera.position.set(p.x, p.y + CFG.eyeHeight + Math.sin(bob) * 0.022, p.z);
  camera.rotation.set(player.pitch, player.yaw, 0);

  if (state.busy || state.ended) return;
  if (state.floor === 5) { // 天台：走进传送门
    if (Math.abs(p.x - world.portal.position.x) < 0.45 && Math.abs(p.z - world.portal.position.z) < 1.0) endGame();
    return;
  }
  if (!state.roomDone && p.z < -16.9 && p.x > 18.5) enterRoom();
  if (p.x < EXIT.x0 - EXIT.run / 2 && p.z < -17.6 && p.z > -20.4 && p.y > 0.5) stairWarp();
}

/* =====================================================================
 * 12. 交互
 * ===================================================================*/
const CENTER = new THREE.Vector2(0, 0);
let focused = null;
function shown(o) { for (; o; o = o.parent) if (!o.visible) return false; return true; }
function findFocus() {
  ray.setFromCamera(CENTER, camera); ray.far = CFG.reach;
  const targets = [...permTargets, ...puzzleTargets].filter(o => o.userData.interact && shown(o));
  let label = ''; focused = null;
  for (const h of ray.intersectObjects(targets, true)) { // 取第一个有可用交互的物体（开着的柜子后面还有钥匙）
    let o = h.object; while (o && !o.userData.interact) o = o.parent;
    if (!o || !shown(o)) continue;
    label = o.userData.interact.label(); if (label) { focused = o; break; }
  }
  const el = $('prompt'); if (label) el.textContent = label; el.style.opacity = label && playing ? 0.85 : 0;
}
function tryInteract() { if (!playing || !focused || state.busy) return; const f = focused; focused = null; f.userData.interact.act(); }
function updateInv() {
  const F = FLOORS[state.floor];
  $('inv').textContent = F.keys ? `「钥匙」 ${F.keys.filter(k => state.keysGot.has(k)).length} / ${F.keys.length}` : '';
}

/* =====================================================================
 * 13. 调试（?debug）：1–5 跳楼层，K 拿齐本层钥匙
 * ===================================================================*/
function debugJump(n) {
  state.floor = n; state.repeat = 0; state.keysGot.clear(); state.wrong = false; state.roomDone = false; state.pendingNext = false;
  setDoor(world.entranceLeaf, world.entranceCol, true); setDoor(world.farLeaf, world.farCol, false);
  applyFloor(n); genPuzzles(); spawn(); if (n === 5) player.pos.z += ROOF_DZ;
}
function debugCollectAll() { (FLOORS[state.floor].keys || []).forEach(k => state.keysGot.add(k)); updateInv(); }

/* =====================================================================
 * 14. 主循环
 * ===================================================================*/
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePlayer(dt);
  for (const p of state.puzzles) p.update?.(dt);
  if (playing) findFocus();
  if (LOOK[state.floor]?.flicker && state.lightsOn) world.lamps.forEach(l => l.light.intensity = LOOK[1].lamp * (Math.random() < 0.02 ? 0.3 : 1));
  updateListener();
  renderer.render(scene, camera);
  if (DEBUG) {
    const p = player.pos;
    $('hud').textContent = `floor ${state.floor}  repeat ${state.repeat}  keys ${[...state.keysGot]}  wrong ${state.wrong}  lights ${state.lightsOn}\n` +
      `puzzles ${state.puzzles.map(q => `${q.id}:${q.tpl}@${q.anchors}`).join('  ')}\n` +
      `pos ${p.x.toFixed(2)} ${p.y.toFixed(2)} ${p.z.toFixed(2)}  calls ${renderer.info.render.calls}  [1-5] 跳楼层 [K] 拿齐钥匙`;
  }
  requestAnimationFrame(tick);
}

(() => {
  buildBuilding(); buildRoof();
  setDoor(world.entranceLeaf, world.entranceCol, true); setDoor(world.farLeaf, world.farCol, false);
  applyFloor(1); genPuzzles(); spawn();
  if (DEBUG) {
    $('hud').style.display = 'block';
    window.__game = { player, state, world, camera, debugJump, debugCollectAll, genPuzzles, forceTemplates: l => { state.forceTpl = l.slice(); } };
  }
  ready = true; $('startText').textContent = '点 击 进 入';
  Platform.emit('ready');
  tick();
})();
</script>
